  restartArmed=0;b.textContent='New game';clearSave();S.mapChoices=null;S.mapResolve=null;S.travel=null;S.dark=0;diceEl.innerHTML='';bannerEl.innerHTML='';sfx.click();showTitle()};
function newGame(){return{heroes:[
  {key:'george',name:'George',title:'the Wizard',type:'wizard',color:'#a58bff',hp:30,maxHp:30,mp:8,maxMp:8,moves:['bonk','fireball','frost'],shield:0,dodge:false,down:false},
  {key:'rory',name:'Rory',title:'the Moonfox',type:'fox',color:'#ff9a4d',hp:34,maxHp:34,mp:8,maxMp:8,moves:['claw','glow','speak'],shield:0,dodge:false,down:false}],
  chapter:1,maxDays:7,node:'village',path:['village'],days:7,potions:0,combo:0,flags:{},stats:{defeated:0,friends:0,wins:0}}}
const SAVE='heroes-of-sardath-save';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}
function fullHeal(){G.heroes.forEach(h=>{h.down=false;h.hp=h.maxHp;h.mp=h.maxMp})}

/* ---------- places ---------- */
const NODE_RUN={
  async woods(){setScene('woods');await story({title:'The Whispering Woods',text:['The trees here are so tall they hide the moon. Giant webs hang everywhere, glittering in the dark.','Rory walks face-first into a giant web. Now she is wearing it like a wedding veil. "Do not. Say. Anything."','Then you hear it: tik-tik-tik-tik. Something with LOTS of legs is coming closer...'],choices:['Get ready to fight!']});
    await battle({bg:'woods',enemies:['spider','spiderling','spider'],tip:true,unlock:[[0,'chain','Chain Lightning!','George learned a new spell: zap every monster at once'],[1,'pounce','Starpounce!','Rory learned to leap through the stars and dodge the next attack']]});
    await story({title:'Out of the woods',text:['The webs are cleared and the path ahead splits in two. You both feel stronger, and you each learned a brand new power!'],choices:['To the map!']})},
  async river(){setScene('river');await story({title:'The Rushing River',text:['You build a raft out of logs, rope and one very surprised duck. Then WHOOSH, down the river! This is the fast way to Sardath!','Then the water starts to bubble and swirl. Something BIG is coming up from the bottom...'],choices:['Hold on tight!']});
    await battle({bg:'river',enemies:['snapper','serpent']})},
  async hollow(){setScene('hollow');await story({title:'Glowcap Hollow',text:['This path is slow and twisty, but everything glows! Mushrooms as big as houses light up the dark in pink and blue.','Rory\'s moon-eyes spot something shiny hidden under a giant mushroom.'],choices:[{label:'Use Moon Sight to look closer',who:'rory'}]});
    HA.rory.cast=1;sfx.magic();burst(560,470,40,'#fff3c4',{type:'star',speed:200});await wait(700);HA.rory.cast=0;G.potions+=2;G.heroes.forEach(h=>{h.maxMp+=1;h.mp=h.maxMp});renderTop();
    await banner('Treasure!','2 potions and a Moonstone (+1 magic each)',1800);
    await story({title:'Uh-oh...',text:['The mushrooms do NOT like visitors poking around. Three of them wake up very, very grumpy!'],choices:['Grumpy mushrooms? Bring it on!']});
    await battle({bg:'hollow',enemies:['toad','toad','toad']})},
  async glade(){setScene('glade','cage');let text=['In a quiet glade, hundreds of fireflies are stuck inside a cage made of shadows.','A tiny voice calls out: "Help us, heroes! We know a secret that can beat Vexmora!" How will you open the cage?'];
    const opts=[{label:'Blast the cage with a Fireball',who:'george'},{label:'Freeze the cage with Frost',who:'george'},{label:'Talk to the fireflies',who:'rory'},{label:'Sing a song together',who:'both'}];
    for(;;){const i=await story({title:'Firefly Glade',text,choices:opts});const cg={x:720,y:360};
      if(i===0){HA.george.cast=1;sfx.fire();const o=orbPos();await projectile(o.x,o.y,cg.x,cg.y,{ms:500,color:'#ff8a3d',size:16});explode(cg.x,cg.y,'#ff8a3d');sfx.boom();S.npc.big=1.5;HA.george.cast=0;text=['WHOOSH! The fire just makes the shadows dance and grow even BIGGER. Shadows love flickery light!','Hmm. Try something else.']}
      else if(i===1){HA.george.cast=1;sfx.shield();burst(cg.x,cg.y,40,'#8fe9ff',{type:'star',speed:200});await wait(600);HA.george.cast=0;text=['Brrr! The shadow bars shiver, but they don\'t break.','Maybe the fireflies can help from the inside?']}
      else if(i===3){for(let k=0;k<3;k++){burst(260,340,6,'#fff3c4',{type:'note',speed:80,grav:-40,dir:-Math.PI/2,spread:1.5});tone(523+k*130,.3,'triangle',.08);await wait(250)}text=['The fireflies LOVE the song and start dancing! But the cage is still there.','If only the fireflies could all glow at exactly the same time...']}
      else break}
    sfx.talk();bubble(HA.rory,'Everybody glow... ONE, TWO, THREE!',1800);await wait(1600);S.flash=1;S.flashColor='#fff7c0';sfx.magic();S.npc.freed=true;burst(720,360,80,'#e8ff7a',{speed:320,size:5,life:1.4});
    await banner('The cage melts away!','',1500);
    await story({title:'The Sunword',text:['The fireflies blaze like a tiny sun and the shadow cage melts away! The Firefly Queen flutters down and lands on Rory\'s nose.','"Thank you! Here is our secret: the SUNWORD. Shadow magic cannot stand it. Shout it together when Vexmora is at her weakest!"'],choices:['We\'ll remember!']});
    G.flags.sunword=true;fullHeal();await banner('You learned the Sunword!','Save it for the final battle',2000)},
  async mountains(){setScene('mountains','dwarves');const i=await story({title:'Frostfang Peaks',text:['Up in the snowy mountains, three dwarves are stuck! A rockfall has blocked their tunnel and snow is piling up fast.','"Help! Can anybody hear us?"'],choices:[{label:'Melt the snow with fire',who:'george'},{label:'Dig them out with super fox paws',who:'rory'}]});
    if(i===0){HA.george.cast=1;sfx.fire();const o=orbPos();await projectile(o.x,o.y,720,400,{ms:500,color:'#ff8a3d',size:16});explode(720,400,'#ff8a3d');HA.george.cast=0}else{sfx.swish();for(let k=0;k<4;k++){burst(700,440,30,'#ffffff',{speed:260,grav:300,dir:-Math.PI/2,spread:1.4});await wait(180)}}
    await story({title:'Dwarf friends',text:[i===0?'FWOOSH! George melts the snow into a giant puddle. The dwarves splash out, slip, and slide down the hill on their bellies like penguins. WHEEEE!':'Rory digs so fast the snow flies like a blizzard. Pop, pop, pop! Out come the dwarves... and the last one lands head-first in a snowdrift with his boots wiggling in the air.','"Thank you! Take these dwarf-forged amulets. They\'ll make you tougher." (+6 health for both heroes)'],choices:['Thanks!']});
    G.heroes.forEach(h=>{h.maxHp+=6});fullHeal();sfx.magic();await banner('+6 Health!','Dwarf-forged amulets',1500);
    setScene('mountains');await story({title:'A howl on the wind',text:['AWOOOO! A snow wolf leaps out of the storm. Behind it stomps the Frostfang Troll, and he thinks this is HIS mountain!','Watch the troll carefully. When he winds up, a GIANT smash is coming.'],choices:['Ready!']});
    await battle({bg:'mountains',enemies:['wolf','troll']})},
  async warren(){setScene('warren');await story({title:'The Shadow Warren',text:['The only way to the lake is through the Shadow Warren, a strange city under the mountain where the stairs go up, down and even upside down!','Night Flyers guard the way out. Remember: Rory\'s moon powers are extra strong against shadow creatures, but Beast Speak won\'t work on them.'],choices:['Charge!']});
    await battle({bg:'warren',enemies:['flyer','captain','flyer']})},
  async lake(){setScene('lake');const archers=G.days>=1;
    await story({title:'Sardath!',text:['At last! The city on stilts glows in the middle of the lake... but Night Flyers and Shadow Bats are swooping all around it!',archers?`You made it with ${G.days} day${G.days>1?'s':''} to spare, so the city archers are ready to help. They'll shoot at the monsters every round!`:'You took the long way, so the city archers are busy defending the walls. You\'re on your own. You can do it!'],choices:['Save the city!']});
    await siege(1);
    setScene('lake','vexmora');sfx.roar();const i=await story({title:'Vexmora',text:['A cold wind blows. A tall shadow floats down onto the dock, her purple eyes glowing... then she trips on her own long robe. THUD. She jumps up VERY fast. "I MEANT to do that."','"Well, well. A wizard who hasn\'t even finished wizard school, and a talking FOX? Go home, little heroes. Sardath is MINE!"'],choices:[{label:'"We\'re not scared of you!"',who:'rory'},{label:'"I did my homework. It was FIREBALLS."',who:'george'}]});
    await story({title:'Vexmora',text:[i===0?'Vexmora laughs, and her shadows grow taller. "Brave little fox. Let\'s see how brave you are in the dark!"':'Vexmora\'s eyes narrow. "Cheeky! Let\'s see your homework, then!"','Remember the Firefly Queen\'s secret. When Vexmora is at half her strength, speak the SUNWORD together!'],choices:['For Sardath!']});
    await battle({bg:'lake',enemies:['boss'],archers,boss:true})},
};

/* ---------- screens ---------- */
function showTitle(){B=null;G=null;S.fireworks=false;S.dark=0;S.mode='title';S.bg='title';S.npc=null;S.showHeroes=false;S.mapChoices=null;for(const a of Object.values(HA))a.hidden=false;initAmbient('title');titleEl.hidden=false;msg('');setTurn('');renderTop();const saved=loadSave();const endOf={1:'lake',2:'tower'};
  const sv=saved&&saved.node!==endOf[saved.chapter||1]?saved:null;
  panel.innerHTML=`<section class="card story"><h2>Choose your adventure</h2><div class="chapters"><div class="chap"><div class="lbl">Chapter 1</div><h3>The Siege of Sardath</h3><p>Save the city on stilts from Vexmora and her Night Flyers.</p><button class="big" id="bNew">Play Chapter 1</button></div><div class="chap hard"><div class="lbl">Chapter 2 &middot; Much harder</div><h3>The Tower of Thorns</h3><p>Vexmora is coming back! Poison, traps, tricky choices, and health that does not refill. Wrong choices can end your adventure.</p><button class="big" id="bNew2">Play Chapter 2</button></div></div>${sv?`<div class="choices"><button class="choice" id="bCont"><span>Continue saved game</span><small>Chapter ${sv.chapter||1}: ${esc(((sv.chapter===2?NODES2:NODES1)[sv.node]||{}).name||'')}</small></button></div>`:''}</section>`;
  $('#bNew').onclick=()=>{sfx.magic();startChapter(1)};$('#bNew2').onclick=()=>{sfx.magic();startChapter(2)};const bc=$('#bCont');if(bc)bc.onclick=()=>{ac();sfx.click();G=sv;G.chapter=G.chapter||1;G.maxDays=G.maxDays||7;useChapter(G.chapter);CHK=JSON.stringify(G);adventure()}}
async function heroIntro(){setScene('village');renderTop();S.showHeroes=true;
  panel.innerHTML=`<div class="intro"><section class="card" style="--c:var(--george)"><div class="hh"><img src="${PORTRAIT.wizard}" alt="George"><div><h3>George the Wizard</h3><div style="color:var(--muted)">Young, brave and VERY good at fireballs.</div></div></div><ul><li><b>Staff Bonk:</b> a free bonk on the head</li><li><b>Fireball:</b> big boom, and it keeps burning</li><li><b>Frost Shield:</b> ice shields protect both heroes</li><li class="later">Learns later: Chain Lightning</li></ul></section>
  <section class="card" style="--c:var(--rory)"><div class="hh"><img src="${PORTRAIT.fox}" alt="Rory"><div><h3>Rory the Moonfox</h3><div style="color:var(--muted)">A silver fox who can talk to any creature and glows in moonlight.</div></div></div><ul><li><b>Moon Claw:</b> a free swipe, extra strong on shadows</li><li><b>Healing Glow:</b> heals both heroes</li><li><b>Beast Speak:</b> make monsters into friends!</li><li class="later">Learns later: Starpounce</li></ul></section></div>
  <section class="card story" style="margin-top:12px"><h2>How to play</h2><p>George goes first, then Rory, then the monsters. The sign above each monster tells you what it will do next, so you can plan together. Fill up the <b style="color:var(--gold)">Team Power</b> bar to unleash <b style="color:var(--gold)">Starfire Storm</b>!</p><p><b style="color:var(--gold)">Dice duels, just like the book!</b> Every attack is a duel: you roll 2 dice + your Skill, the monster rolls 2 dice + its Skill, and the higher total wins. Double six is a CRITICAL hit! When it really matters, <b>Test your Luck</b>.</p><p>Collect gold and treasure on the way (check your <b>Backpack</b>), and get ready for a big <b>siege</b> at the end!</p><p>You have 7 days to reach Sardath. Each place on the map takes time, so choose your path wisely.</p><div class="choices"><button class="big" id="bGo">Let's go!</button></div></section>`;
  sfx.talk();bubble(HA.rory,'Hi! I\'m Rory!',1600);setTimeout(()=>bubble(HA.george,'And I\'m George!',1600),900);
  $('#bGo').onclick=async()=>{sfx.click();await village();adventure()}}
async function village(){setScene('village','elder');await story({title:'Emberwick Village',text:['Elder Wren holds up her lantern. "You came! Vexmora\'s army will attack Sardath in 7 days. You must get there first and stop her."','"Take these two potions. Drink one if you get hurt in a battle. Good luck, heroes!"','George pops a potion open to sniff it. The cork shoots out and BONKS Elder Wren right on the nose. "...Maybe keep the lids ON, dear."'],choices:['We will save Sardath!']});G.potions+=2;renderTop();sfx.magic();burst(290,360,40,'#5ee0b0',{type:'star',speed:180});await banner('+2 Potions','',1200)}
function mapScreen(){S.mode='map';S.npc=null;titleEl.hidden=true;setTurn('');renderTop();save();CHK=JSON.stringify(G);const nx=NODES[G.node].next;msg(nx.length>1?'Two paths! Pick one on the map or below.':'Click the glowing spot to travel.');
  return new Promise(res=>{S.mapChoices=nx;S.mapResolve=res;panel.innerHTML=`<section class="card story"><h2>${G.chapter===2?'The road to the Tower':'The road to Sardath'}</h2><p>${G.chapter===2?`${G.days} night${G.days===1?'':'s'} until the full moon.${G.days<=2?' Hurry!':''}`:`${G.days} day${G.days===1?'':'s'} left before Vexmora attacks the city.`} Where to next?</p><div class="choices">${nx.map(id=>`<button class="choice" data-node="${id}"><span>${NODES[id].name}</span><small>${NODES[id].blurb}</small></button>`).join('')}</div></section>`;
    armButtons('[data-node]',b=>chooseNode(b.dataset.node))})}
function chooseNode(id){if(!S.mapChoices||!S.mapChoices.includes(id))return;sfx.click();S.mapChoices=null;S.hover=null;cv.style.cursor='default';panel.querySelectorAll('button').forEach(x=>x.disabled=true);const r=S.mapResolve;S.mapResolve=null;r(id)}
async function travel(to){S.travel={from:G.node,to,p:0};msg(`Travelling to ${NODES[to].name}...`);for(let i=0;i<5;i++)tone(300+i*40,.08,'triangle',.04,null,i*.2);await tween(1100,p=>S.travel.p=ease(p));G.days=Math.max(0,G.days-NODES[to].cost);G.node=to;G.path.push(to);S.travel=null;renderTop();await wait(250)}
async function adventure(){titleEl.hidden=true;useChapter(G.chapter||1);const ch2=G.chapter===2,END=ch2?'tower':'lake',RUN=ch2?NODE_RUN2:NODE_RUN;for(;;){if(G.node===END)break;const next=await mapScreen();await travel(next);await RUN[next]();save();if(next===END)break}await(ch2?ending2():ending())}
async function ending(){clearSave();setScene('dawn');S.fireworks=true;sfx.win();msg('');banner('Sardath is saved!','',2800);
  panel.innerHTML=`<section class="card story"><h2>Sardath is saved!</h2><p>Vexmora's shadows burst into a million sparkles and blow away on the wind. The sun rises over the lake, and the whole city cheers from its stilts!</p><p>George and Rory are named <b style="color:var(--gold)">Guardians of Sardath</b> forever. The Firefly Queen says she's never seen a brighter pair of heroes.</p>
  <div class="stats"><div class="stat"><b>${G.stats.defeated}</b><span>monsters defeated</span></div><div class="stat"><b>${G.stats.friends}</b><span>monsters befriended</span></div><div class="stat"><b>${G.days}</b><span>days to spare</span></div></div><div class="choices"><button class="big" id="bAgain">Play again</button></div></section>`;
  $('#bAgain').onclick=()=>{sfx.click();showTitle()}}

/* ---------- boot ---------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{delete bgCache.map});
const hot=window.claude&&window.claude.hot;
// Updates always open on the title screen; "Continue saved game" is there for anyone mid-adventure.
function start(){showTitle()}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>

</html>
