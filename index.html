<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Heroes of Sardath: a co-op fantasy adventure with dice duels, treasure and siege battles.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230a0d28%22/%3E%3Cpath d=%22M50 12 L60 40 L90 40 L66 58 L75 88 L50 70 L25 88 L34 58 L10 40 L40 40 Z%22 fill=%22%23ffd66b%22/%3E%3C/svg%3E">
<style>html,body{margin:0}img{max-width:100%}</style>
<title>Heroes of Sardath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Uncial+Antiqua&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#0a0d28; --deep:#12163f; --line:#323a80;
  --moon:#e8ecff; --muted:#aab2e6; --george:#a58bff; --rory:#ff9a4d; --heal:#5ee0b0;
  --danger:#ff5277; --gold:#ffd66b; --ice:#8fe9ff;
  --display:'Uncial Antiqua', Papyrus, Georgia, serif;
  --body:'Andika', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--moon)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:12px 28px;
  background:radial-gradient(ellipse at 50% -10%,#1d2466 0%,var(--night) 55%) fixed,var(--night)}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;color:var(--gold);margin-right:auto;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--moon);font-variant-numeric:tabular-nums}
.moons{display:inline-flex;gap:4px}
.moons i{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px #ffd66b99;display:block}
.moons i.off{background:#262c6a;box-shadow:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill.btn{cursor:pointer}
#stageWrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55)}
#stage{display:block;width:100%;aspect-ratio:16/9;background:#070920;touch-action:manipulation}
#msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:rgba(8,10,34,.82);border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-weight:700;font-size:clamp(11px,1.7vw,16px);text-align:center;pointer-events:none}
#msg:empty,#turn:empty{display:none}
#turn{position:absolute;left:10px;bottom:10px;background:rgba(8,10,34,.82);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:clamp(11px,1.6vw,14px);font-weight:700;pointer-events:none}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:0 16px}
#banner .b{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
#banner .bt{font-family:var(--display);font-size:clamp(26px,6.4vw,76px);line-height:1.05;background:linear-gradient(180deg,#fff8d8,#ffd66b 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1a5a) drop-shadow(0 0 22px rgba(255,190,90,.55))}
#banner .bs{font-weight:700;font-size:clamp(14px,2.6vw,24px);line-height:1.35;margin:10px auto 0;max-width:min(92%,640px);background:rgba(8,10,34,.86);border:1px solid var(--line);border-radius:14px;padding:10px 18px;text-wrap:balance;text-shadow:none}
#banner .bhint{margin-top:8px;font-size:13px;color:var(--muted);text-shadow:0 1px 4px #000}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
#dice{position:absolute;left:50%;top:50px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#dice .row{display:flex;gap:10px}
.die{width:clamp(26px,5vw,50px);aspect-ratio:1;background:linear-gradient(145deg,#fff6dc,#ecd29a);border-radius:22%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;box-shadow:inset 0 -4px 0 #cfae6a,0 8px 18px rgba(0,0,0,.55)}
.die span{width:72%;height:72%;border-radius:50%;background:#3b1d12;place-self:center;visibility:hidden}
.die span.on{visibility:visible}
.die.roll{animation:tumble .18s linear infinite}
.die.land{animation:land .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes tumble{0%{transform:rotate(0)}50%{transform:rotate(180deg) translateY(-8px)}100%{transform:rotate(360deg)}}
@keyframes land{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.dsum{font-weight:700;background:rgba(8,10,34,.85);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:clamp(11px,1.8vw,16px);white-space:nowrap}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:4%;pointer-events:none;text-align:center}
#title h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7.6vw,88px);margin:0;line-height:1;background:linear-gradient(100deg,#ffe9a8 0%,#fff 30%,#ffd66b 50%,#ff9a4d 70%,#ffe9a8 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #2a1450) drop-shadow(0 0 30px rgba(255,200,120,.45));animation:shine 5s linear infinite}
#title p{margin:6px 0 0;font-size:clamp(11px,2vw,18px);font-weight:700;color:#e4e8ff;text-shadow:0 2px 8px #000}
@keyframes shine{to{background-position:-200% 0}}
.card{background:linear-gradient(180deg,#1b2154,#151a45);border:1px solid var(--line);border-radius:16px;padding:14px}
.battle{display:grid;grid-template-columns:1fr minmax(200px,240px) 1fr;gap:12px;align-items:start}
.hero{--c:var(--george);transition:box-shadow .2s}
.hero.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 28px color-mix(in srgb,var(--c) 45%,transparent)}
.hh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.hh img{width:64px;height:64px;border-radius:14px;border:2px solid var(--c);background:#0d1033;flex:none}
.hh h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:21px;color:var(--c);line-height:1.1}
.hh h3 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.bars{display:grid;gap:4px;flex:1;min-width:0}
.barrow{display:grid;grid-template-columns:50px 1fr 50px;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.barrow b{color:var(--moon);text-align:right}
.bar{height:12px;border-radius:6px;background:#0a0c26;overflow:hidden;border:1px solid #2a3170}
.bar i{display:block;height:100%}
.hp i{background:linear-gradient(90deg,#ff5277,#ff8aa0)}
.mp i{background:linear-gradient(90deg,#4f7bff,#8fe9ff)}
.tp{height:16px}
.tp i{background:linear-gradient(90deg,#9b7bff,#ffd66b,#ff8a3d)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:22px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#262c6a;color:var(--moon)}
.tag.go{background:var(--c);color:#160f2c}
.tag.bad{background:#5a1a33;color:#ffc2d0}
.tag.ice{background:#123a58;color:var(--ice)}
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.move{display:flex;flex-direction:column;gap:1px;text-align:left;background:#232a6a;border:1px solid #39428c;border-radius:12px;padding:8px 10px;transition:transform .12s,background .12s}
.move:not(:disabled):hover{transform:translateY(-2px);background:#2c3480;border-color:var(--c)}
.move:disabled{opacity:.4}
.mn{font-weight:700;font-size:15px}
.mc{font-size:12px;color:var(--ice);font-weight:700}
.md{font-size:12.5px;color:var(--muted);line-height:1.3}
.center{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
.team,.sun,.potion{display:flex;flex-direction:column;text-align:left;gap:1px;border-radius:12px;padding:9px 12px;border:1px solid #444ea0;background:#232a6a}
.team small,.sun small,.potion small{font-size:12.5px;opacity:.85}
.team:not(:disabled){background:linear-gradient(135deg,#7b5cff,#ff8a3d);border-color:#ffd66b;color:#fff;box-shadow:0 0 24px #ffb35a88;animation:throb 1.2s ease-in-out infinite}
.sun{background:linear-gradient(135deg,#ffe28a,#ffb347);color:#3a1d0a;border-color:#fff3c4;box-shadow:0 0 26px #ffd66baa;animation:throb 1s ease-in-out infinite}
.team:disabled,.potion:disabled,.sun:disabled{opacity:.45;animation:none}
@keyframes throb{50%{transform:scale(1.035)}}
.pick{background:#11153a;border:1px dashed var(--gold);border-radius:12px;padding:8px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{background:#2b2f6e;border:1px solid var(--gold);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700}
.tbtn small{color:var(--muted);font-weight:400}
.tbtn.ghost{border-color:#444ea0}
.story{max-width:780px;margin:0 auto;width:100%}
.story h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:0 0 6px;font-size:26px;text-wrap:balance}
.story p{margin:0 0 10px;font-size:17px;max-width:65ch}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.choice{--c:#444ea0;background:#262d72;border:1px solid color-mix(in srgb,var(--c) 70%,#262d72);border-radius:12px;padding:10px 16px;font-weight:700;font-size:16px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:transform .12s}
.choice:not(:disabled):hover{transform:translateY(-2px);background:#2f3786}
.choice small{font-weight:400;font-size:13.5px;color:var(--muted)}
.chip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--c);color:#150f2a}
.big{background:linear-gradient(135deg,#ffd66b,#ff8a3d);color:#2a1206;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:18px;box-shadow:0 8px 24px #ff8a3d55}
.big:hover{filter:brightness(1.08)}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.intro .card{--c:var(--george)}
.intro h3{font-family:var(--display);font-weight:400;color:var(--c);margin:0;font-size:24px}
.intro ul{margin:8px 0 0;padding-left:18px}
.intro li{margin-bottom:4px}
.intro li b{color:var(--c)}
.intro .later{color:var(--muted);font-style:italic}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.stat{background:#12163f;border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
.stat b{display:block;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chapters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 10px}
.chap{background:#12163f;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chap h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold)}
.chap p{margin:0 0 6px;font-size:15px;color:var(--muted)}
.chap.hard{border-color:#8a2a4a;background:linear-gradient(180deg,#22123a,#12163f)}
.chap.hard h3{color:#ff9aa8}
.chap.hard .big{background:linear-gradient(135deg,#ff6a8a,#9b5cff);color:#fff}
@media (max-width:760px){.battle,.intro,.chapters{grid-template-columns:1fr}.brand{font-size:18px}.story h2{font-size:22px}.story p{font-size:16px}}
.duel{display:flex;align-items:center;gap:clamp(6px,1.5vw,16px);background:rgba(8,10,34,.88);border:1px solid var(--line);border-radius:16px;padding:8px 14px}
.duel .dside{display:flex;flex-direction:column;align-items:center;gap:5px}
.duel .dn{font-weight:700;color:var(--c);font-size:clamp(11px,1.8vw,15px);white-space:nowrap}
.duel .ds{font-size:clamp(10px,1.6vw,13px);font-weight:700;white-space:nowrap}
.duel .ds b{font-size:1.35em;color:var(--c)}
.duel .die{width:clamp(26px,5.2vw,54px)}
.duel .vs{font-family:var(--display);color:var(--gold);font-size:clamp(14px,3vw,30px)}
.verdict{font-family:var(--display);font-size:clamp(16px,3.4vw,34px);text-shadow:0 3px 0 #1a1030,0 0 16px rgba(0,0,0,.8)}
.verdict:empty{display:none}
.verdict.good{color:#8dff9a;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.verdict.bad{color:#ff7a90;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.sklk{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.sklk b{color:var(--moon)}
.lucky{display:flex;flex-direction:column;text-align:left;gap:1px;border-radius:12px;padding:9px 12px;border:1px solid #3a8a5a;background:#173a2a}
.lucky.on{background:linear-gradient(135deg,#2a8a4a,#8dff9a);color:#0a2012;box-shadow:0 0 20px #8dff9a88}
.lucky small{font-size:12.5px;opacity:.85}
.lucky:disabled{opacity:.45}
.luckask{background:#2a1a10;border:2px solid var(--gold);border-radius:12px;padding:10px}
.luckask p{margin:4px 0 8px;font-size:14px}
#bag{position:fixed;inset:0;z-index:20;background:rgba(4,6,20,.72);display:grid;place-items:center;padding:16px}
.bagcard{max-width:640px;width:100%;max-height:88vh;overflow:auto}
.baghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.baghead h2{font-family:var(--display);font-weight:400;color:var(--gold);margin:0}
.bagstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bagstats .bs{background:#12163f;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;font-size:14px}
.bagstats .bs b{color:var(--c)}
.bagitems,.shop{display:grid;gap:8px;margin-bottom:10px}
.bagitem,.shopitem{background:#12163f;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bagitem small,.shopitem small{display:block;color:var(--muted);font-size:13px}
.gold b{color:var(--gold)}
.scout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.scout div{background:#2a1420;border:1px solid #6a2a3a;border-radius:10px;padding:8px}
.scout b{display:block;color:#ff9aa8;font-size:13px}
.scout span{font-size:14px}
.deflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:4px 0 12px}
.defbtn{display:flex;flex-direction:column;text-align:left;gap:2px;background:#232a6a;border:1px solid #39428c;border-radius:12px;padding:8px 10px}
.defbtn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.defbtn:disabled{opacity:.4}
.defbtn small{font-size:12px;color:var(--muted)}
.slotgrid{display:grid;gap:6px;margin:4px 0 8px}
.slotrow{display:grid;grid-template-columns:130px 1fr 1fr;gap:6px;align-items:center}
.slotbtn{background:#161a44;border:1px dashed #4a52a0;border-radius:10px;padding:8px;font-weight:700;font-size:14px}
.slotbtn:not(:disabled){border-color:var(--gold);background:#2a2a5a}
.siegeturn .heroes2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.siegeturn .sh{margin:0;font-family:var(--display);font-weight:400;color:var(--c);font-size:21px}
.sact{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chosen{font-size:14px;color:#8dff9a;font-weight:700;min-height:20px}
.muted{color:var(--muted);font-size:12.5px}
@media (max-width:760px){.scout,.siegeturn .heroes2,.bagstats{grid-template-columns:1fr}.slotrow{grid-template-columns:1fr 1fr}.slotrow b{grid-column:1/-1}}
#dstage{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(10,12,40,.5),rgba(4,5,20,.85));animation:dsin .25s ease both;overflow:auto}
#dstage.out{animation:dsout .25s ease both}
@keyframes dsin{from{opacity:0}to{opacity:1}}
@keyframes dsout{to{opacity:0}}
.dsbox{width:min(780px,100%);background:linear-gradient(180deg,#1d2358,#12163f);border:2px solid var(--gold);border-radius:22px;padding:16px clamp(12px,3vw,24px);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(255,214,107,.2);text-align:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.dstitle{font-family:var(--display);color:var(--gold);font-size:clamp(20px,4vw,32px);margin-bottom:12px;text-wrap:balance}
.dsrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(84px,170px) minmax(0,1fr);gap:clamp(8px,2vw,20px);align-items:stretch}
#dstage.single .dsrow{grid-template-columns:minmax(0,1fr) minmax(84px,190px)}
.dcol{background:#0e1236;border:2px solid color-mix(in srgb,var(--c) 45%,#262c6a);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .3s,box-shadow .3s}
.dcol.active{box-shadow:0 0 0 2px var(--c),0 0 26px color-mix(in srgb,var(--c) 50%,transparent)}
.dcol.win{transform:scale(1.07);box-shadow:0 0 0 3px var(--gold),0 0 44px rgba(255,214,107,.65)}
.dcol.lose{opacity:.5;transform:scale(.94) rotate(-1deg)}
.dname{font-family:var(--display);font-size:clamp(18px,3vw,26px);color:var(--c)}
.dskill{font-size:14px;color:var(--muted);font-weight:700;min-height:1.3em}
.dskill span{color:var(--ice)}
.cupwrap{height:clamp(110px,18vw,150px);display:grid;place-items:end center;width:100%}
.cup{width:clamp(72px,11vw,98px);background:none;border:0;padding:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transform-origin:50% 88%;transition:transform .25s ease,opacity .3s}
.cup svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.cup:disabled{cursor:default}
.cup:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.cup.ready{animation:cupbob 1.1s ease-in-out infinite;cursor:grab}
.cup.ready svg{filter:drop-shadow(0 0 16px rgba(255,214,107,.9)) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.cup.shaking{cursor:grabbing}
.cup.shaking.l1{animation:shake1 .16s linear infinite}
.cup.shaking.l2{animation:shake2 .11s linear infinite}
.cup.shaking.l3{animation:shake3 .07s linear infinite}
.cup.tip{transform:rotate(-118deg) translate(10px,-14px)}
.dcol[data-side="R"] .cup.tip{transform:rotate(118deg) translate(-10px,-14px)}
.cup.done{opacity:.3;transform:scale(.8)}
@keyframes cupbob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes shake1{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,-3px) rotate(-6deg)}75%{transform:translate(4px,-2px) rotate(6deg)}}
@keyframes shake2{0%,100%{transform:translate(0,-5px) rotate(0)}25%{transform:translate(-9px,-12px) rotate(-13deg)}75%{transform:translate(9px,-7px) rotate(13deg)}}
@keyframes shake3{0%,100%{transform:translate(0,-9px) rotate(0)}25%{transform:translate(-14px,-20px) rotate(-22deg)}75%{transform:translate(14px,-13px) rotate(22deg)}}
.tray{min-height:clamp(62px,10vw,84px);width:100%;border-radius:12px;background:radial-gradient(ellipse at center,#1f5a3a,#123a26);box-shadow:inset 0 4px 12px rgba(0,0,0,.5);display:flex;gap:10px;justify-content:center;align-items:center;padding:8px;flex-wrap:wrap;transition:box-shadow .3s}
.tray.crit{box-shadow:inset 0 4px 12px rgba(0,0,0,.5),0 0 34px #ffd66b}
.tray.oops{box-shadow:inset 0 4px 12px rgba(0,0,0,.5),0 0 34px #ff7a90}
.die.big{width:clamp(42px,7vw,64px);flex:none}

<script>
(()=>{
'use strict';
const W=960,H=540,TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d');
const panel=$('#panel'),msgEl=$('#msg'),bannerEl=$('#banner'),diceEl=$('#dice'),turnEl=$('#turn'),titleEl=$('#title');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SC=1;
function fit(){const w=cv.clientWidth||W;const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr);SC=cv.width/W;}
addEventListener('resize',fit);fit();

/* ---------- utils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pickOne=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tweens=[];
function tween(ms,fn){return new Promise(res=>tweens.push({t0:performance.now(),ms:Math.max(1,ms),fn,res}))}

/* ---------- sound (synth, no files) ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,f2=null,delay=0){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,freq=1200,delay=0){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const len=Math.floor(a.sampleRate*d);const buf=a.createBuffer(1,len,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(t)}
const sfx={
  click:()=>tone(660,.08,'triangle',.07),
  hit:()=>{noise(.16,.3,900);tone(190,.14,'square',.06,80)},
  fire:()=>{noise(.55,.22,700);tone(180,.45,'sawtooth',.05,620)},
  boom:()=>{noise(.7,.45,320);tone(95,.55,'sine',.3,38)},
  zap:()=>{for(let i=0;i<5;i++)tone(rnd(900,1700),.07,'square',.045,rnd(200,400),i*.035)},
  heal:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'sine',.09,null,i*.07)),
  shield:()=>{tone(1200,.5,'triangle',.06,600);tone(900,.5,'sine',.05,1500)},
  dice:()=>{for(let i=0;i<6;i++)noise(.035,.25,3200,i*.075)},
  magic:()=>{for(let i=0;i<8;i++)tone(700+i*160,.22,'sine',.045,null,i*.04)},
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.32,'triangle',.1,null,i*.12)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.45,'triangle',.09,null,i*.18)),
  talk:()=>{for(let i=0;i<5;i++)tone(rnd(420,760),.08,'sine',.06,null,i*.09)},
  poof:()=>{noise(.3,.18,2400);tone(500,.3,'sine',.05,1300)},
  roar:()=>{noise(.6,.3,500);tone(110,.6,'sawtooth',.06,70)},
  swish:()=>noise(.18,.2,2600),
};

/* ---------- drawing helpers ---------- */
function starPath(g,x,y,r,ir=r*.45,n=5,rot=-Math.PI/2){g.beginPath();for(let i=0;i<n*2;i++){const rr=i%2?ir:r,a=rot+i*Math.PI/n;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function ell(g,x,y,rx,ry,c,rot=0){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,TAU);g.fill()}
function tri(g,a,b,c,d,e,f){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function glow(g,x,y,r,c,a=1){if(r<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.globalAlpha*=clamp(a,0,1);g.globalCompositeOperation='lighter';g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore()}
function shadow(g,w){ell(g,0,0,w,w*.2,'rgba(0,0,0,.35)')}
function heartPath(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s,y-s*.3,x-s*.45,y-s,x,y-s*.45);g.bezierCurveTo(x+s*.45,y-s,x+s,y-s*.3,x,y+s*.35);g.closePath()}

/* ---------- backgrounds ---------- */
function skyGrad(g,stops){const gr=g.createLinearGradient(0,0,0,H);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));g.fillStyle=gr;g.fillRect(0,0,W,H)}
function starsP(g,n,seed,maxY){const r=seeded(seed);g.fillStyle='#fff';for(let i=0;i<n;i++){const x=r()*W,y=r()*r()*maxY,s=r()<.1?2.2:1.2;g.globalAlpha=.3+r()*.7;g.fillRect(x,y,s,s)}g.globalAlpha=1}
function moonP(g,x,y,r,c='#fff4d6'){glow(g,x,y,r*3.2,'rgba(255,240,200,.35)');ell(g,x,y,r,r,c);g.globalAlpha=.12;ell(g,x-r*.3,y-r*.2,r*.22,r*.22,'#8a7a9a');ell(g,x+r*.35,y+r*.25,r*.16,r*.16,'#8a7a9a');ell(g,x+r*.1,y-r*.45,r*.1,r*.1,'#8a7a9a');g.globalAlpha=1}
function ridge(g,baseY,amp,color,seed,n=8,snow=null){const r=seeded(seed),pts=[];for(let i=0;i<=n;i++)pts.push([i*W/n+(r()-.5)*W/n*.4,baseY-(i%2?amp*(.55+r()*.45):amp*r()*.25)]);pts[0][0]=-20;pts[n][0]=W+20;g.fillStyle=color;g.beginPath();g.moveTo(-20,H);pts.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(W+20,H);g.closePath();g.fill();
  if(snow){g.fillStyle=snow;for(let i=1;i<n;i+=2){const[px,py]=pts[i],[ax,ay]=pts[i-1],[bx,by]=pts[i+1],k=.28;g.beginPath();g.moveTo(px,py);g.lineTo(lerp(px,ax,k),lerp(py,ay,k));g.lineTo(lerp(px,ax,k*.45),lerp(py,ay,k*.45)+9);g.lineTo(lerp(px,bx,k*.3),lerp(py,by,k*.3)+13);g.lineTo(lerp(px,bx,k),lerp(py,by,k));g.closePath();g.fill()}}}
function hills(g,baseY,amp,color,seed){const r=seeded(seed),f1=.004+r()*.004,f2=.01+r()*.01,p1=r()*6,p2=r()*6;g.fillStyle=color;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=8)g.lineTo(x,baseY-(Math.sin(x*f1+p1)*.6+Math.sin(x*f2+p2)*.4)*amp);g.lineTo(W,H);g.closePath();g.fill()}
function pines(g,baseY,color,seed,count,hmin,hmax,snow){const r=seeded(seed);g.fillStyle=color;g.fillRect(0,baseY,W,H-baseY);for(let i=0;i<count;i++){const x=r()*(W+60)-30,h=hmin+r()*(hmax-hmin),w=h*.36,y=baseY+r()*14;g.fillStyle=color;g.fillRect(x-2,y-h*.15,4,h*.2);for(let k=0;k<4;k++){const ty=y-h*.12-k*h*.2,tw=w*(1-k*.2);tri(g,x-tw,ty,x,ty-h*.4,x+tw,ty);if(snow){g.fillStyle=snow;tri(g,x-tw*.35,ty-h*.26,x,ty-h*.4,x+tw*.35,ty-h*.26);g.fillStyle=color}}}}
function roundTrees(g,baseY,color,seed,count,rmin,rmax){const r=seeded(seed);g.fillStyle=color;g.fillRect(0,baseY,W,H-baseY);for(let i=0;i<count;i++){const x=r()*(W+40)-20,s=rmin+r()*(rmax-rmin);g.fillRect(x-3,baseY-s*1.2,6,s*1.3);ell(g,x,baseY-s*1.6,s,s*.9,color);ell(g,x-s*.6,baseY-s*1.2,s*.7,s*.6,color);ell(g,x+s*.6,baseY-s*1.25,s*.7,s*.6,color)}}
function web(g,cx,cy,r){g.save();g.strokeStyle='rgba(220,230,255,.22)';g.lineWidth=1;for(let i=0;i<8;i++){const a=i*TAU/8;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.stroke()}for(let k=1;k<=4;k++){g.beginPath();for(let i=0;i<=8;i++){const a=i*TAU/8,rr2=r*k/4.3;g.lineTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2)}g.stroke()}g.restore()}
function stiltCity(g,cx,wy,s){g.save();g.translate(cx,wy);g.scale(s,s);const r=seeded(99);g.strokeStyle='#221a3e';g.lineWidth=4;
  for(let x=-205;x<=205;x+=18){g.beginPath();g.moveTo(x,-38);g.lineTo(x+(r()-.5)*4,8);g.stroke()}
  g.lineWidth=2;for(let x=-205;x<205;x+=36){g.beginPath();g.moveTo(x,-30);g.lineTo(x+18,-4);g.moveTo(x+18,-30);g.lineTo(x,-4);g.stroke()}
  g.fillStyle='#2c2352';g.fillRect(-215,-44,430,8);
  const bl=[[-205,46,50,'peak'],[-160,38,84,'peak'],[-120,58,46,'flat'],[-60,34,128,'tower'],[-24,72,78,'dome'],[50,40,58,'peak'],[92,46,104,'tower'],[140,66,52,'peak']];
  for(const[x,w,h,k]of bl){const y=-44-h;g.fillStyle='#3a2f68';g.fillRect(x,y,w,h);g.fillStyle='#4c3d86';
    if(k==='peak')tri(g,x-5,y,x+w/2,y-w*.55,x+w+5,y);
    else if(k==='tower'){tri(g,x-4,y,x+w/2,y-w*1.1,x+w+4,y);g.strokeStyle='#5a4a90';g.lineWidth=2;g.beginPath();g.moveTo(x+w/2,y-w*1.1);g.lineTo(x+w/2,y-w*1.1-18);g.stroke();g.fillStyle='#ff8a3d';tri(g,x+w/2,y-w*1.1-18,x+w/2+14,y-w*1.1-13,x+w/2,y-w*1.1-8)}
    else if(k==='dome'){g.beginPath();g.arc(x+w/2,y,w/2,Math.PI,0);g.fill()}
    else g.fillRect(x-3,y-6,w+6,6);
    g.save();g.shadowColor='#ffb347';g.shadowBlur=10;for(let wy2=y+10;wy2<-54;wy2+=18)for(let wx=x+7;wx<x+w-8;wx+=13)if(r()<.55){g.fillStyle=r()<.5?'#ffd27a':'#ffb44d';g.fillRect(wx,wy2,6,9)}g.restore()}
  g.restore()}
function house(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#2a1f35';g.fillRect(24,-78,10,24);g.fillStyle='#4a3a58';g.fillRect(-40,-50,80,50);g.fillStyle='#2c2140';tri(g,-48,-48,0,-88,48,-48);g.save();g.shadowColor='#ffb347';g.shadowBlur=14;g.fillStyle='#ffcf6b';g.fillRect(-28,-36,14,14);g.fillRect(14,-36,14,14);g.restore();g.fillStyle='#231a2e';g.fillRect(-6,-26,12,26);g.restore()}
function stairs(g,x,y,n,sz,rot,color){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=color;g.beginPath();g.moveTo(0,0);for(let i=0;i<n;i++){g.lineTo(i*sz,-(i+1)*sz);g.lineTo((i+1)*sz,-(i+1)*sz)}g.lineTo(n*sz,-n*sz+sz*1.3);g.lineTo(0,sz*1.3);g.closePath();g.fill();g.strokeStyle='#5b4aa0';g.lineWidth=2;g.beginPath();g.moveTo(0,0);for(let i=0;i<n;i++){g.lineTo(i*sz,-(i+1)*sz);g.lineTo((i+1)*sz,-(i+1)*sz)}g.stroke();g.restore()}
function crystals(g,x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='#b36bff';g.shadowBlur=20;[[-18,-40,-8],[0,-70,0],[16,-48,10],[30,-30,18]].forEach(([dx,h,lean],i)=>{g.fillStyle=i%2?'#9b5cff':'#c79bff';g.beginPath();g.moveTo(dx-8,0);g.lineTo(dx+lean-2,h);g.lineTo(dx+lean+4,h+6);g.lineTo(dx+8,0);g.closePath();g.fill()});g.restore()}
function mushroom(g,x,y,s,cap,glowC){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#d9d0e8';rr(g,-8,-60,16,60,6);g.fill();glow(g,0,-66,70,glowC,.45);g.fillStyle=cap;g.beginPath();g.moveTo(-44,-58);g.quadraticCurveTo(0,-118,44,-58);g.quadraticCurveTo(0,-50,-44,-58);g.fill();g.fillStyle='rgba(255,255,255,.7)';ell(g,-16,-78,5,4,'rgba(255,255,255,.7)');ell(g,10,-86,6,4,'rgba(255,255,255,.7)');ell(g,22,-70,4,3,'rgba(255,255,255,.7)');g.restore()}
function lakeScene(g,o){
  if(o.dawn){skyGrad(g,['#27347e','#7a64b0','#f39a8c','#ffd59a']);glow(g,300,318,220,'rgba(255,210,140,.8)');ell(g,300,318,38,38,'#fff0c8')}
  else{skyGrad(g,['#060920','#141b52','#3c2f7a','#8a4f8f']);starsP(g,170,7,H*.55);moonP(g,770,100,46)}
  ridge(g,300,70,o.dawn?'#4a3f7a':'#1b1b4a',11,10);ridge(g,318,40,o.dawn?'#3b3268':'#15163d',12,14);
  const wy=322,wg=g.createLinearGradient(0,wy,0,H);wg.addColorStop(0,o.dawn?'#8a7ab8':'#2a2f7a');wg.addColorStop(1,o.dawn?'#2a2a6a':'#0a0c2a');g.fillStyle=wg;g.fillRect(0,wy,W,H-wy);
  const r=seeded(5),mx=o.dawn?300:770;for(let i=0;i<16;i++){g.fillStyle=o.dawn?`rgba(255,220,160,${.35-i*.02})`:`rgba(255,240,200,${.28-i*.016})`;const w=70-i*3;g.fillRect(mx-w/2+(r()-.5)*20,wy+6+i*11,w,2.5)}
  const cx=o.title?480:610,s=o.title?1.25:1;
  g.save();g.beginPath();g.rect(0,wy,W,H-wy);g.clip();g.globalAlpha=.25;g.translate(0,2*wy);g.scale(1,-1);stiltCity(g,cx,wy,s);g.restore();
  stiltCity(g,cx,wy,s);
  if(o.dock){g.fillStyle='#2b1d18';g.fillRect(0,392,W,H-392);for(let y=396,i=0;y<H;y+=17,i++){g.fillStyle=i%2?'#5a3c2c':'#4e3325';g.fillRect(0,y,W,15)}
    g.strokeStyle='#2a1a12';g.lineWidth=2;const r2=seeded(8);for(let i=0;i<40;i++){const x=r2()*W,y=396+Math.floor(r2()*8)*17;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+15);g.stroke()}
    g.fillStyle='#7a5238';g.fillRect(0,392,W,4);g.fillStyle='#3a2519';for(let x=40;x<W;x+=180)g.fillRect(x,372,14,24)}
  else{g.strokeStyle='#0a0a20';g.lineWidth=3;const r3=seeded(3);for(let i=0;i<40;i++){const x=i<20?r3()*140:W-r3()*140,h=40+r3()*80;g.beginPath();g.moveTo(x,H);g.quadraticCurveTo(x+6,H-h*.6,x+(r3()-.5)*20,H-h);g.stroke()}}
}
function paintBG(key,g){switch(key){
  case 'title':lakeScene(g,{title:true});break;

function spray(x1,y1,x2,y2,color){let t=0;const ms=420;fx.push(dt=>{t+=dt*1000;if(t>ms)return false;for(let i=0;i<3;i++){const tt=.42;spawn({x:x1+rnd(-10,10),y:y1+rnd(-10,10),vx:(x2-x1)/tt+rnd(-60,60),vy:(y2-y1)/tt+rnd(-60,60),life:tt,size:rnd(3,7),color})}return true});return wait(480)}
function starfall(x,y){const ps=[];for(let i=0;i<6;i++)ps.push(wait(i*70).then(()=>projectile(x+rnd(-260,260),-30,x+rnd(-25,25),y+rnd(-25,25),{ms:420,color:'#ffd66b',size:12,arc:0,trail:'#fff3c4'})));return Promise.all(ps)}
function sunburst(x,y){let t=0;const ms=1600;fx.push(dt=>{t+=dt*1000;const p=t/ms;if(p>=1)return false;ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(x,y);ctx.rotate(t/900);ctx.globalAlpha=Math.sin(p*Math.PI)*.8;for(let i=0;i<16;i++){ctx.rotate(TAU/16);const gr=ctx.createLinearGradient(0,0,500,0);gr.addColorStop(0,'#fff3b0');gr.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(560,-26);ctx.lineTo(560,26);ctx.closePath();ctx.fill()}ctx.restore();return true});burst(x,y,70,'#ffd66b',{speed:420,size:7,life:1.2,type:'star'})}
function charge(c,color){for(let i=0;i<30;i++){const a=rnd(0,TAU),d=rnd(80,140);spawn({x:c.x+Math.cos(a)*d,y:c.y+Math.sin(a)*d,vx:-Math.cos(a)*d*1.6,vy:-Math.sin(a)*d*1.6,life:.6,size:5,color})}}

/* ---------- ambient ---------- */
let amb=[];
const AMB={woods:'firefly',glade:'firefly',village:'firefly',hollow:'spore',mountains:'snow',warren:'mote',lake:'glint',title:'glint',river:'glint',dawn:'glint'};
function newAmb(type,init){const p={type,x:rnd(0,W),y:rnd(0,H),t:rnd(0,6),s:rnd(1,3)};if(type==='snow'&&!init)p.y=-10;if((type==='spore'||type==='mote')&&!init)p.y=H+10;if(type==='glint'){p.y=S.bg==='lake'||S.bg==='dawn'?rnd(330,388):S.bg==='river'?rnd(300,540):rnd(330,540);if(S.bg==='river')p.x=rnd(430,W)}if(type==='firefly')p.y=rnd(120,H-60);return p}
function initAmbient(bg){amb=[];const type=AMB[bg];if(!type)return;const n={snow:110,firefly:30,spore:40,mote:36,glint:34}[type];for(let i=0;i<(RM?n/3:n);i++)amb.push(newAmb(type,true))}
function drawAmbient(dt){ctx.save();for(const p of amb){p.t+=dt;switch(p.type){
  case 'snow':p.y+=dt*(30+p.s*22);p.x+=Math.sin(p.t+p.s)*dt*22;if(p.y>H+10)Object.assign(p,newAmb('snow'));ctx.globalAlpha=.85;ell(ctx,p.x,p.y,p.s*.9,p.s*.9,'#fff');break;
  case 'firefly':p.x+=Math.cos(p.t*.7+p.s)*dt*18;p.y+=Math.sin(p.t*.9)*dt*12;ctx.globalAlpha=1;glow(ctx,p.x,p.y,7+p.s*2,'#d8ff7a',.3+.7*Math.max(0,Math.sin(p.t*2+p.s)));break;
  case 'spore':case 'mote':p.y-=dt*(10+p.s*8);p.x+=Math.sin(p.t)*dt*10;if(p.y<-10)Object.assign(p,newAmb(p.type));ctx.globalAlpha=1;glow(ctx,p.x,p.y,5+p.s*2,p.type==='mote'?'#b36bff':p.s>2?'#ff7ad9':'#5ef2d6',.7);break;
  case 'glint':{const a=Math.max(0,Math.sin(p.t*1.5+p.s*3));ctx.globalAlpha=a*.7;ctx.fillStyle='#fff4d2';ctx.fillRect(p.x-p.s*4,p.y,p.s*8,1.5);break}}}ctx.restore()}
function drawBGAnim(t){if(S.bg==='title'||S.bg==='lake'){for(let k=0;k<4;k++){const a=t*.4+k*1.6,x=(S.bg==='title'?480:610)+Math.cos(a)*(230+k*30),y=150+Math.sin(a*1.3)*50+k*12,f=Math.sin(t*10+k);ctx.fillStyle='#0a0618';ctx.save();ctx.translate(x,y);ctx.scale(Math.cos(a)>0?-1:1,1);for(const s of[-1,1]){ctx.save();ctx.scale(s,1);tri(ctx,0,0,16,-6-f*6,12,4);ctx.restore()}ell(ctx,0,0,4,5,'#0a0618');ctx.restore()}}}

/* ---------- actors & overlays ---------- */

  if(fly){ctx.save();ctx.translate(a.x+a.ox,a.y);shadow(ctx,def.w*.28);ctx.restore()}
  ctx.translate(a.x+a.ox,a.y+a.oy-fly);if(a.rot)ctx.rotate(a.rot);applyPose(a,t);if(a.down){ctx.globalAlpha*=.5;if(a.type==='wizard'){ctx.translate(-20,-8);ctx.rotate(-1.35)}}
  if(a.flash>0)ctx.filter='brightness(2.6)';DRAW[a.type](ctx,t+a.phase,a);ctx.restore()}
function heroCenter(h){const a=HA[h.key];return a.type==='wizard'?{x:a.x+a.ox,y:a.y+a.oy-70}:{x:a.x+a.ox+10,y:a.y+a.oy-45}}
function orbPos(){const a=HA.george;return{x:a.x+a.ox+32,y:a.y+a.oy-124-(a.castS||0)*18}}
function drawHeroOverlay(h,t){const a=HA[h.key],c=heroCenter(h);
  if(h.shield>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35+Math.sin(t*4)*.1;ctx.strokeStyle='#8fe9ff';ctx.lineWidth=3;ctx.fillStyle='rgba(143,233,255,.12)';ctx.beginPath();ctx.ellipse(c.x,c.y-5,70,85,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore()}

  if(h.down){ctx.save();ctx.font='700 22px Andika, sans-serif';ctx.fillStyle='#cfd6ff';ctx.textAlign='center';for(let i=0;i<3;i++){const p=(t*.6+i/3)%1;ctx.globalAlpha=1-p;ctx.fillText('z',c.x+10+p*30,c.y-40-p*50)}ctx.restore()}}
function drawEnemyOverlay(e,t){const d=EDEF[e.type],x=e.x+e.ox;if(!alive(e))return;
  const tg=B&&B.targeting&&B.targeting.cands.includes(e);
  if(tg){const hov=S.hover===e;ctx.save();ctx.strokeStyle='#ffd66b';ctx.lineWidth=hov?5:3;ctx.globalAlpha=.6+Math.sin(t*6)*.3;ctx.beginPath();ctx.ellipse(x,e.y,d.w*.45,d.w*.12,0,0,TAU);ctx.stroke();const ay=e.y-(d.fly||0)-d.h-40+Math.sin(t*6)*6;ctx.fillStyle='#ffd66b';tri(ctx,x-12,ay-16,x+12,ay-16,x,ay);ctx.restore()}
  const bw=86,by=e.y+12;ctx.fillStyle='rgba(8,10,34,.85)';rr(ctx,x-bw/2-3,by-3,bw+6,26,8);ctx.fill();ctx.fillStyle='#2a1030';ctx.fillRect(x-bw/2,by,bw,7);ctx.fillStyle='#ff5277';ctx.fillRect(x-bw/2,by,bw*e.hp/e.maxHp,7);
  ctx.font='700 11px Andika, sans-serif';ctx.fillStyle='#e8ecff';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(`${d.name}${e.wary>0?' (grumpy)':''}  ${e.hp}/${e.maxHp}`,x,by+9);
  let sx=x-bw/2;const icons=[];if(e.burn>0)icons.push(['#ff8a3d','burn']);if(e.calm>0)icons.push(['#ff7ab8','calm']);if(e.stun>0)icons.push(['#ffd66b','stun']);if(e.armor<1)icons.push(['#9b5cff','armor']);
  icons.forEach(([c,k],i)=>{const ix=x+bw/2+12+i*16,iy=by+8;glow(ctx,ix,iy,10,c,.8);ell(ctx,ix,iy,4,4,c)});
  const it=e.intent;let txt=null,col='#fff',dot=null;
  if(e.calm>0){txt='Calm and sleepy';col='#ff9ad5'}else if(e.stun>0){txt='Stunned!';col='#ffd66b'}
  else if(it){if(it.t==='atk'){txt=`${it.n} ${it.d[0]}-${it.d[1]}${it.poison?' +poison':''}`;dot=G.heroes[it.target];col=it.big?'#ff5277':'#ffffff'}else if(it.t==='aoe'){txt=`${it.n} ${it.d[0]}-${it.d[1]} to both${it.poison?' +poison':''}`;col=it.big?'#ff5277':'#ffb36b'}else if(it.t==='drain'){txt=`${it.n} (steals magic)`;dot=G.heroes[it.target];col='#7fb8ff'}else if(it.t==='charge'){txt=`${it.n}... BIG hit next!`;col='#ffd66b'}else if(it.t==='heal'){txt=`${it.n} (heals)`;col='#5ee0b0'}else if(it.t==='summon'){txt=it.n;col='#c49bff'}}
  if(!txt)return;ctx.font='700 13px Andika, sans-serif';const tw=ctx.measureText(txt).width,pw=tw+20+(dot?24:0);const py=e.y-(d.fly||0)-d.h-18+Math.sin(t*3+e.phase)*2;const px=clamp(x,pw/2+6,W-pw/2-6);
  ctx.fillStyle='rgba(8,10,34,.88)';rr(ctx,px-pw/2,py-13,pw,26,13);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=it&&it.big?2.5:1.5;ctx.stroke();ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(txt,px-pw/2+10,py+1);
  if(dot){const cx=px+pw/2-16;ell(ctx,cx,py,9,9,dot.color);ctx.fillStyle='#150f2a';ctx.textAlign='center';ctx.fillText(dot.name[0],cx,py+1)}}

/* ---------- map drawing ---------- */
function drawMap(t){ctx.drawImage(getBG(G.chapter===2?'map2':'map'),0,0,W,H);const cur=G.node,path=G.path;
  for(const[a,b]of EDGES){const A=NODES[a],Bn=NODES[b];let taken=false;for(let i=1;i<path.length;i++)if(path[i-1]===a&&path[i]===b)taken=true;const open=S.mapChoices&&a===cur&&S.mapChoices.includes(b);
    ctx.save();ctx.lineCap='round';ctx.setLineDash(taken?[]:[8,9]);ctx.lineDashOffset=open?-t*24:0;ctx.strokeStyle=taken?'#ffd66b':open?'#8fe9ff':'rgba(200,210,255,.3)';ctx.lineWidth=taken?4:3;if(taken||open){ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10}ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(Bn.x,Bn.y);ctx.stroke();ctx.restore()}
  for(const[id,n]of Object.entries(NODES)){const vis=path.includes(id),open=S.mapChoices&&S.mapChoices.includes(id);const hov=S.hover===id;
    if(open){glow(ctx,n.x,n.y,40+Math.sin(t*4)*6,'#8fe9ff',.6);ctx.strokeStyle='#8fe9ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.x,n.y,22+Math.sin(t*4)*3+(hov?4:0),0,TAU);ctx.stroke()}
    ell(ctx,n.x,n.y,16,16,vis?'#ffd66b':open?'#1c3a6a':'#1a2048');ctx.strokeStyle=vis?'#fff3c4':open?'#8fe9ff':'#4a5290';ctx.lineWidth=2;ctx.beginPath();ctx.arc(n.x,n.y,16,0,TAU);ctx.stroke();glyph(id,n.x,n.y,vis?'#3a1d0a':open?'#bff4ff':'#8a92c8');
    ctx.font='17px "Uncial Antiqua", Georgia, serif';ctx.textAlign='center';ctx.textBaseline='top';const ly=n.up?n.y-44:n.y+22;ctx.lineWidth=4;ctx.strokeStyle='rgba(6,8,26,.9)';ctx.strokeText(n.name,n.x,ly);ctx.fillStyle=open?'#bff4ff':vis?'#ffe7a0':'#c6cdf5';ctx.fillText(n.name,n.x,ly);
    if(open&&n.cost){ctx.font='700 12px Andika, sans-serif';const tx=`${n.cost} ${G.chapter===2?"night":"day"}${n.cost>1?'s':''}`;ctx.strokeText(tx,n.x,ly+20);ctx.fillStyle='#ffd66b';ctx.fillText(tx,n.x,ly+20)}}
  let px,py;if(S.travel){const A=NODES[S.travel.from],Bn=NODES[S.travel.to];px=lerp(A.x,Bn.x,S.travel.p);py=lerp(A.y,Bn.y,S.travel.p)-Math.abs(Math.sin(S.travel.p*Math.PI*5))*6}else{px=NODES[cur].x;py=NODES[cur].y}
  ctx.save();ctx.translate(px-12,py-4);ctx.scale(.3,.3);drawWizard(ctx,t,{});ctx.restore();ctx.save();ctx.translate(px+10,py-2);ctx.scale(.3,.3);drawFox(ctx,t,{});ctx.restore()}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(S.hitstop>0){S.hitstop-=dt;for(const tw of tweens)tw.t0+=dt*1000}else for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];const p=clamp((now-tw.t0)/tw.ms,0,1);tw.fn(p);if(p>=1){tweens.splice(i,1);tw.res()}}
  ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);ctx.save();
  if(S.shake>0&&!RM){ctx.translate(rnd(-1,1)*S.shake,rnd(-1,1)*S.shake);S.shake*=.86;if(S.shake<.4)S.shake=0}
  if(S.zoom>.001){ctx.translate(W/2,H/2);ctx.scale(1+S.zoom,1+S.zoom);ctx.translate(-W/2,-H/2);S.zoom*=.9}
  if(S.mode==='map'&&G)drawMap(t);
  else{ctx.drawImage(getBG(S.bg),0,0,W,H);drawBGAnim(t);drawAmbient(dt);if(S.mode==='siege')drawSiege(t,dt);if(S.dark>0){ctx.fillStyle=`rgba(4,3,18,${S.dark})`;ctx.fillRect(0,0,W,H)}
    const list=[];if(S.npc)list.push([S.npc,null]);if(S.showHeroes&&G)for(const h of G.heroes){HA[h.key].down=h.down;if(!HA[h.key].hidden)list.push([HA[h.key],null])}
    if(S.mode==='battle'&&B)for(const e of B.enemies)if(!e.gone)list.push([e,EDEF[e.type]]);
    drawCastCircles(t);list.sort((a,b)=>a[0].y-b[0].y).forEach(([a,d])=>drawActor(a,t,d));
    if(S.showHeroes&&G&&S.mode==='battle')G.heroes.forEach(h=>drawHeroOverlay(h,t));
    if(S.mode==='battle'&&B)B.enemies.forEach(e=>!e.gone&&drawEnemyOverlay(e,t));
    if(S.fireworks&&Math.random()<dt*2.2){const cols=['#ffd66b','#ff7ab8','#8fe9ff','#a58bff','#5ee0b0','#ff8a3d'];burst(rnd(100,860),rnd(60,240),46,pickOne(cols),{speed:230,size:4,life:1.3,grav:70});if(Math.random()<.5)tone(rnd(200,400),.3,'sine',.03,80)}}
  for(let i=fx.length-1;i>=0;i--)if(fx[i](dt)===false)fx.splice(i,1);
  ctx.save();ctx.globalCompositeOperation='lighter';for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.color;
    if(p.type==='smoke'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a*.4;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(2-a),0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter'}else if(p.type==='star'){starPath(ctx,p.x,p.y,p.size*1.4);ctx.fill()}else if(p.type==='heart'){ctx.globalCompositeOperation='source-over';heartPath(ctx,p.x,p.y,p.size);ctx.fill();ctx.globalCompositeOperation='lighter'}else if(p.type==='note'){ctx.font='700 22px Andika, sans-serif';ctx.fillText('♪',p.x,p.y)}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();ctx.globalAlpha=a*.25;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.6,0,TAU);ctx.fill()}}ctx.restore();
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>f.life){floats.splice(i,1);continue}const p=f.t/f.life,sc=p<.12?.5+p/.12*.7:1.2-Math.min(.2,(p-.12));ctx.save();ctx.globalAlpha=p>.7?(1-p)/.3:1;ctx.translate(f.x+(f.vx||0)*p,f.y-Math.sin(Math.min(1,p*1.8)*Math.PI/2)*62+Math.max(0,p-.55)*30);ctx.scale(sc,sc);ctx.font=`700 ${f.size}px Andika, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=6;ctx.strokeStyle='rgba(10,6,30,.9)';ctx.strokeText(f.text,0,0);ctx.fillStyle=f.color;ctx.fillText(f.text,0,0);ctx.restore()}
  ctx.restore();
  drawXfade(dt);if(S.flash>0){ctx.globalAlpha=Math.min(1,S.flash);ctx.fillStyle=S.flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;S.flash=Math.max(0,S.flash-dt*2.5)}
  for(const a of[HA.george,HA.rory,S.npc,...(B?B.enemies:[])])if(a){if(a.flash>0)a.flash-=dt;if(a.jig){a.jigT+=dt;if(a.jigT>1.2)a.jig=0}a.castS=(a.castS||0)+((a.cast||0)-(a.castS||0))*Math.min(1,dt*9);if(a.talk>0)a.talk-=dt;if(a.big>0)a.big-=dt}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- canvas input ---------- */
function toStage(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
function enemyAt(p){if(!B||!B.targeting)return null;let best=null;for(const e of B.targeting.cands){const d=EDEF[e.type],top=e.y-(d.fly||0)-d.h-20;if(p.x>e.x-d.w/2-10&&p.x<e.x+d.w/2+10&&p.y>top&&p.y<e.y+40)best=e}return best}
function nodeAt(p){if(!S.mapChoices)return null;return S.mapChoices.find(id=>Math.hypot(NODES[id].x-p.x,NODES[id].y-p.y)<36)||null}
cv.addEventListener('mousemove',ev=>{const p=toStage(ev);S.hover=S.mode==='map'?nodeAt(p):enemyAt(p);cv.style.cursor=S.hover?'pointer':'default'});
cv.addEventListener('click',ev=>{const p=toStage(ev);if(S.mode==='map'){const id=nodeAt(p);if(id)chooseNode(id)}else{const e=enemyAt(p);if(e)pickTarget(e)}});

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

let rollId=0;
async function roll(n,bonus,label){const id=++rollId;const vals=Array.from({length:n},()=>ri(1,6));
  diceEl.innerHTML=`<div class="row">${vals.map(()=>`<div class="die roll">${'<span></span>'.repeat(9)}</div>`).join('')}</div><div class="dsum">${esc(label)}...</div>`;
  const dice=[...diceEl.querySelectorAll('.die')];sfx.dice();const iv=setInterval(()=>dice.forEach(d=>setFace(d,ri(1,6))),70);
  await wait(600);clearInterval(iv);dice.forEach((d,i)=>{d.classList.remove('roll');d.classList.add('land');setFace(d,vals[i])});
  const total=vals.reduce((a,b)=>a+b,0)+bonus;diceEl.querySelector('.dsum').textContent=`${label}: ${vals.join(' + ')}${bonus?` + ${bonus}`:''} = ${total}`;
  await wait(420);setTimeout(()=>{if(rollId===id)diceEl.innerHTML=''},1100);return total}
function renderTop(){const d=G?G.days:7,m=G&&G.maxDays||7;$('#daysL').textContent=G&&G.chapter===2?'Nights left':'Days left';$('#days').innerHTML=Array.from({length:m},(_,i)=>`<i class="${i<d?'':'off'}"></i>`).join('');$('#daysN').textContent=d;$('#pots').textContent=G?G.potions:0;
  const hp=$('#hpPill');if(G&&S.mode!=='title'){hp.hidden=false;hp.innerHTML=G.heroes.map(h=>`<span style="color:${h.color}">${h.name}</span> <b>${Math.max(0,h.hp)}/${h.maxHp}</b>${h.poison>0?' <span style="color:#8dff6a">poisoned</span>':''}`).join(' &middot; ')}else hp.hidden=true}
$('#snd').onclick=()=>{muted=!muted;$('#snd').textContent=muted?'Sound: off':'Sound: on';if(!muted)sfx.click()};

const SLOTS=[[700,458],[838,428],[585,492],[872,505]],BOSS_SLOTS=[[790,440],[600,488],[640,398],[905,505]];
const alive=e=>e&&!e.gone&&!e.dying&&e.hp>0;
const aliveEnemies=()=>B?B.enemies.filter(alive):[];
const aliveHeroes=()=>G.heroes.filter(h=>!h.down);
const cur=()=>G.heroes[B.turn];
function enemyCenter(e){const d=EDEF[e.type];return{x:e.x+e.ox,y:e.y+e.oy-(d.fly||0)-d.h*.5}}
function addEnemy(type){const d=EDEF[type];const used=B.enemies.filter(e=>!e.gone).map(e=>e.slot);let slot=d.kind==='boss'?0:B.slots.findIndex((s,i)=>!used.includes(i)&&(i!==0||!B.def.boss));if(slot<0)return null;const[x,y]=B.slots[slot];
  const e=Object.assign(mkActor(type,x,y),{slot,name:d.name,kind:d.kind,hp:d.hp,maxHp:d.hp,intent:null,burn:0,calm:0,stun:0,armor:d.armor||1,gone:false,dying:false,nextBig:null});B.enemies.push(e);return e}
function chooseIntent(e){const d=EDEF[e.type];const randHero=()=>{const al=G.heroes.map((h,i)=>i).filter(i=>!G.heroes[i].down);return al.length?pickOne(al):0};
  if(e.nextBig){e.intent=Object.assign({},e.nextBig,{big:true,target:randHero()});e.nextBig=null;return}
  const ms=d.moves.filter(m=>(m.t!=='heal'||aliveEnemies().some(o=>o.hp<o.maxHp))&&(m.t!=='summon'||aliveEnemies().length<3)&&(m.t!=='charge'||B.round>1||e.type==='troll'));
  let tot=ms.reduce((a,m)=>a+m.w,0),r=Math.random()*tot,m=ms[0];for(const x of ms){r-=x.w;if(r<=0){m=x;break}}
  e.intent=Object.assign({},m);if(m.t==='atk'||m.t==='drain')e.intent.target=randHero()}

  fireball:{name:'Fireball',cost:3,target:'enemy',desc:'A huge fireball! 2 dice + 3, and it keeps burning.',async run(h,e){const a=HA.george;a.cast=1;sfx.magic();msg('George casts FIREBALL!');const dmg=await roll(2,3,'Fireball');const o=orbPos(),c=enemyCenter(e);sfx.fire();await projectile(o.x,o.y,c.x,c.y,{ms:520,color:'#ff8a3d',size:18,trail:'#ffcf6b',arc:70});explode(c.x,c.y,'#ff8a3d');sfx.boom();S.shake=12;a.cast=0;await hitEnemy(e,dmg,{label:'Burning!',color:'#ff9a3d'});if(alive(e))e.burn=2}},
  frost:{name:'Frost Shield',cost:2,target:'none',desc:'Ice shields on BOTH heroes block 8 damage this round.',async run(){HA.george.cast=1;sfx.shield();msg('Frost Shield! Both heroes are protected.');for(const x of aliveHeroes()){x.shield=8;const c=heroCenter(x);burst(c.x,c.y,30,'#8fe9ff',{speed:150,type:'star',size:4});ring(c.x,c.y,'#8fe9ff',90);float(c.x,c.y-70,'Shield 8','#8fe9ff',24)}gainCombo(10);renderHUD();await wait(750);HA.george.cast=0}},
  chain:{name:'Chain Lightning',cost:5,target:'none',desc:'Zap EVERY monster at once. 2 dice each.',async run(){HA.george.cast=1;msg('CHAIN LIGHTNING!');const dmg=await roll(2,0,'Chain Lightning');let from=orbPos();for(const e of aliveEnemies()){const c=enemyCenter(e);sfx.zap();await bolt(from.x,from.y,c.x,c.y);burst(c.x,c.y,20,'#9ff4ff',{speed:240,size:3});await hitEnemy(e,dmg);from=c}HA.george.cast=0}},
  claw:{name:'Moon Claw',cost:0,target:'enemy',desc:'Swipe! 1 die + 3. Extra strong on shadow creatures.',async run(h,e){let dmg=await roll(1,3,'Moon Claw'),label=null,crit=false;if(e.kind!=='beast'){dmg=Math.ceil(dmg*1.5);label='Moonlight x1.5!'}if(Math.random()<.2){dmg*=2;crit=true}await lungeHit(HA.rory,e,async()=>{slash(enemyCenter(e));await hitEnemy(e,dmg,{label,color:'#e8f6ff',crit,phys:true})})}},
  glow:{name:'Healing Glow',cost:3,target:'none',desc:'Heal BOTH heroes 2 dice + 4. Wakes up a knocked-out friend!',async run(){HA.rory.cast=1;msg('Rory glows like the full moon...');const amt=await roll(2,4,'Healing Glow');sfx.heal();for(const x of G.heroes)healHero(x,amt);gainCombo(amt*1.5);await wait(800);HA.rory.cast=0}},

    burst(c.x,c.y,40,'#ffd66b',{type:'star',speed:300,size:6});ring(c.x,c.y,'#ffd66b',120);S.shake=10;await hitEnemy(e,dmg,{label:'Starpounce!',color:'#ffd66b',phys:true});

/* ---------- combat mechanics ---------- */
function gainCombo(n){const was=G.combo;G.combo=Math.min(100,Math.round(G.combo+n));if(was<100&&G.combo>=100&&!G.flags.comboTip){G.flags.comboTip=true;banner('Team Power full!','Press STARFIRE STORM for a giant team attack',2200)}}
async function lungeHit(a,target,onHit){const dx=(target.x-a.x)*.62,dy=(target.y-a.y)*.3;sfx.swish();await tween(170,p=>{a.ox=dx*ease(p);a.oy=dy*ease(p)});await onHit();await tween(240,p=>{a.ox=dx*(1-ease(p));a.oy=dy*(1-ease(p))})}
function knock(a,dir){tween(260,p=>{a.ox=(a.ox||0)*0+dir*14*Math.sin(p*Math.PI)})}
async function hitEnemy(e,amt,o={}){if(!alive(e))return;if(o.phys&&EDEF[e.type].tough){amt=Math.ceil(amt/2);if(!o.label){o.label='Tough! Half damage';o.color='#cfd6e0'}}amt=Math.max(1,Math.round(amt*(e.armor||1)));e.hp=Math.max(0,e.hp-amt);e.flash=.18;const c=enemyCenter(e);
  float(c.x,c.y-10,(o.crit?'CRIT! ':'')+amt,o.crit?'#ffd66b':'#ffffff',o.crit?48:40);if(o.label)float(c.x,c.y-58,o.label,o.color||'#fff',22);
  sfx.hit();S.shake=Math.max(S.shake,o.crit?14:6);if(!o.noCombo)gainCombo(amt*2);
  if(e.hp<=0){e.dying=true;G.stats.defeated++;if(EDEF[e.type].kind!=='boss'&&Math.random()<.35)await blastOff(e);else{sfx.poof();burst(c.x,c.y,40,'#c9b6ff',{speed:260,size:5,type:'star'});burst(c.x,c.y,20,'#fff',{speed:120});await tween(420,p=>{e.alpha=1-p;e.sy=1-p*.65;e.sx=1+p*.5})}e.gone=true}
  if(e.type==='boss2'&&!e.raged&&e.hp>0&&e.hp<=e.maxHp/2)await bossRage(e);
  renderHUD()}
async function hurtHero(h,amt,poison){const a=HA[h.key],c=heroCenter(h);if(h.down)return;
  if(h.dodge){h.dodge=false;float(c.x,c.y-50,'Dodged!','#ffd66b',32);await tween(300,p=>{a.oy=-Math.sin(p*Math.PI)*50});renderHUD();return}
  if(h.shield>0){const ab=Math.min(h.shield,amt);h.shield-=ab;amt-=ab;float(c.x,c.y-80,`Blocked ${ab}`,'#8fe9ff',24);sfx.shield();burst(c.x,c.y,16,'#8fe9ff',{type:'star',speed:180});if(amt<=0){renderHUD();return}}
  h.hp=Math.max(0,h.hp-amt);a.flash=.2;float(c.x,c.y-20,'-'+amt,'#ff5277',40);if(poison&&h.hp>0){h.poison=3;float(c.x,c.y-60,'Poisoned!','#8dff6a',26)}sfx.hit();S.shake=Math.max(S.shake,8);knock(a,-1);
  if(h.hp<=0){h.down=true;h.shield=0;h.dodge=false;float(c.x,c.y-70,'Knocked out!','#ffc2d0',26);msg(`${h.name} is knocked out! ${h.key==='george'?'Rory can wake him with Healing Glow':'George can wake her with a potion'}.`)}
  renderHUD();await wait(150)}
function healHero(h,amt){const c=heroCenter(h);if(h.poison>0){h.poison=0;float(c.x,c.y-110,'Poison cured!','#8dff6a',24)}if(h.down){h.down=false;h.hp=0;float(c.x,c.y-80,'Awake!','#5ee0b0',26)}h.hp=Math.min(h.maxHp,h.hp+amt);float(c.x,c.y-30,'+'+amt,'#5ee0b0',38);burst(c.x,c.y+20,26,'#b8ffe6',{speed:90,grav:-160,life:1,size:4,type:'star',dir:-Math.PI/2,spread:1.6});renderHUD()}

/* ---------- battle flow ---------- */
function battle(def){return new Promise(resolve=>{const snap=JSON.stringify({heroes:G.heroes,potions:G.potions,combo:G.combo});
  const start=()=>setupBattle(def,async()=>{await postVictory(def);resolve()},()=>{const s=JSON.parse(snap);G.heroes=s.heroes;G.potions=s.potions;G.combo=s.combo;start()});start()})}
async function setupBattle(def,resolve,retry){S.mode='battle';setScene(def.bg,null,true);S.mode='battle';
  B={def,resolve,retry,enemies:[],turn:0,round:1,phase:'intro',busy:true,targeting:null,archers:!!def.archers,sunUsed:false,slots:def.boss?BOSS_SLOTS:SLOTS};
  def.enemies.forEach(t=>addEnemy(t));if(def.mod)def.mod(B);G.heroes.forEach(h=>{h.shield=0;h.dodge=false;h.down=h.hp<=0;if(G.chapter!==2)h.mp=h.maxMp});
  B.enemies.forEach(e=>e.ox=420);renderHUD();msg('');setTurn('');
  if(def.boss)sfx.roar();await tween(700,p=>B.enemies.forEach(e=>e.ox=420*(1-ease(p))));
  B.enemies.forEach(chooseIntent);await banner(def.boss?'Final Battle!':'Battle!','',1100);beginHeroTurn()}
function beginHeroTurn(){while(B.turn<2&&G.heroes[B.turn].down)B.turn++;if(B.turn>=2){enemyPhase();return}
  B.phase='hero';B.busy=false;const h=cur();setTurn(`Round ${B.round} · ${h.name}'s turn`);
  msg(B.def.tip&&B.round===1?(B.turn===0?'Tip: pick a power, then a monster. Every attack is a DICE DUEL: 2 dice + Skill against 2 dice + Skill!':'Rory\'s turn! Beast Speak makes hurt creatures go home as friends.'):`${h.name}'s turn! Pick a power.`);renderHUD()}
function canAct(){return B&&B.phase==='hero'&&!B.busy}
function chooseMove(id){if(!canAct())return;const h=cur(),m=MOVES[id];if(h.mp<m.cost)return;sfx.click();
  if(m.target==='enemy'||m.target==='beast'){const cands=aliveEnemies().filter(e=>m.target!=='beast'||speakable(e));if(!cands.length)return;if(cands.length===1)return execMove(id,cands[0]);B.targeting={id,cands};msg(m.target==='beast'?'Who should Rory talk to? Click a creature.':'Click the monster to hit!');renderHUD();return}
  execMove(id,null)}
function pickTarget(e){if(!B||!B.targeting||!B.targeting.cands.includes(e))return;execMove(B.targeting.id,e)}
async function execMove(id,target){B.targeting=null;B.busy=true;S.hover=null;const h=cur();h.mp-=MOVES[id].cost;renderHUD();await MOVES[id].run(h,target);await afterHeroAction()}
async function afterHeroAction(){renderHUD();if(checkWin())return;await wait(250);B.turn++;beginHeroTurn()}
function checkWin(){if(B.phase!=='done'&&aliveEnemies().length===0){finishBattle(true);return true}return false}
async function enemyPhase(){B.phase='enemy';B.busy=true;setTurn(`Round ${B.round} · Monsters' turn`);msg('The monsters are moving...');renderHUD();await wait(500);
  for(const e of[...B.enemies]){if(!alive(e))continue;if(!aliveHeroes().length)break;const c=enemyCenter(e);
    if(e.stun>0){e.stun--;float(c.x,c.y-40,'Stunned!','#ffd66b',26);await wait(600);continue}
    if(e.calm>0){e.calm--;hearts(c,5);float(c.x,c.y-40,'Zzz...','#ff9ad5',26);if(e.calm===0)e.wary=3;await wait(600);continue}
    await enemyAct(e);if(e.rage&&alive(e)&&aliveHeroes().length){await wait(350);chooseIntent(e);await enemyAct(e)}await wait(280)}
  if(!aliveHeroes().length)return finishBattle(false);
  await roundEndHooks();if(!aliveHeroes().length)return finishBattle(false);
  for(const e of aliveEnemies())if(e.burn>0){e.burn--;const c=enemyCenter(e);burst(c.x,c.y,14,'#ff8a3d',{speed:120,grav:-100});await hitEnemy(e,3,{label:'Burn',color:'#ff9a3d'});await wait(200)}
  if(checkWin())return;
  if(B.archers){msg("Sardath's archers fire from the walls!");for(let k=0;k<2;k++){const al=aliveEnemies();if(!al.length)break;const e=pickOne(al),c=enemyCenter(e);sfx.swish();await projectile(980,90,c.x,c.y,{ms:380,color:'#ffe9b0',size:6,arc:30});await hitEnemy(e,3,{label:'Arrow!',color:'#ffe9b0'})}await wait(250);if(checkWin())return}
  G.heroes.forEach(h=>{h.shield=0;h.dodge=false;if(!h.down)h.mp=Math.min(h.maxMp,h.mp+2)});B.round++;aliveEnemies().forEach(chooseIntent);B.turn=0;beginHeroTurn()}
async function enemyAct(e){const it=e.intent,d=EDEF[e.type];if(!it)return;const col=d.c||'#c49bff',c=enemyCenter(e);
  if(it.t==='drain')return enemyDrain(e,it);
  if(it.t==='charge'){msg(`${e.name}: ${it.n}! A BIG hit is coming next turn. Use a shield!`);sfx.roar();e.cast=1;charge(c,'#ffd66b');await wait(800);e.cast=0;e.nextBig=it.big;return}
  if(it.t==='heal'){const tg=aliveEnemies().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];const amt=ri(it.d[0],it.d[1]);tg.hp=Math.min(tg.maxHp,tg.hp+amt);const tc=enemyCenter(tg);float(tc.x,tc.y-20,'+'+amt,'#5ee0b0',34);burst(tc.x,tc.y,16,'#5ee0b0',{grav:-120,speed:80});sfx.heal();msg(`${e.name} munches a mushroom and heals ${tg.name}!`);renderHUD();await wait(700);return}
  if(it.t==='summon'){msg(`${e.name}: ${it.n}!`);sfx.poof();for(let k=0;k<2;k++){const b=addEnemy(d.summon||'bat');if(b){chooseIntent(b);const bc=enemyCenter(b);burst(bc.x,bc.y,24,'#9b5cff',{speed:200})}}await wait(800);return}
  if(it.t==='aoe'){msg(`${e.name} uses ${it.n}!`);e.cast=1;sfx.swish();const ts=aliveHeroes();await Promise.all(ts.map(h=>{const hc=heroCenter(h);return spray(c.x,c.y,hc.x,hc.y,col)}));e.cast=0;if(it.big){S.shake=18;sfx.boom()}for(const h of ts)await hurtHero(h,ri(it.d[0],it.d[1]),it.poison);return}
  let h=G.heroes[it.target];if(!h||h.down)h=pickOne(aliveHeroes());if(!h)return;const dmg=ri(it.d[0],it.d[1]);msg(`${e.name} uses ${it.n} on ${h.name}!`);
  if(d.ranged){const hc=heroCenter(h);e.cast=1;await projectile(c.x,c.y,hc.x,hc.y,{ms:460,color:col,size:it.big?24:13,arc:40});e.cast=0;explode(hc.x,hc.y,col);if(it.big){S.shake=18;sfx.boom()}await hurtHero(h,dmg,it.poison)}

/* ---------- battle HUD ---------- */
function bar(l,v,m,c){return`<div class="barrow"><span>${l}</span><div class="bar ${c}"><i style="width:${Math.round(v/m*100)}%"></i></div><b>${v}/${m}</b></div>`}
function heroCard(h,i,active){const me=active&&B.turn===i;const tags=[];if(me)tags.push('<span class="tag go">Your turn!</span>');if(h.down)tags.push('<span class="tag bad">Knocked out</span>');if(h.shield>0)tags.push(`<span class="tag ice">Shield ${h.shield}</span>`);if(h.dodge)tags.push('<span class="tag ice">Dodge ready</span>');if(h.poison>0)tags.push(`<span class="tag bad">Poisoned (${h.poison})</span>`);
  const beasts=aliveEnemies().some(speakable);
  const mv=h.moves.map(id=>{const m=MOVES[id];const ok=me&&!h.down&&h.mp>=m.cost&&(id!=='speak'||beasts);return`<button class="move" data-move="${id}" ${ok?'':'disabled'}><span class="mn">${m.name}</span><span class="mc">${m.cost?`${m.cost} magic`:'Free'}</span><span class="md">${id==='speak'&&!beasts?'No creature will listen right now!':m.desc}</span></button>`}).join('');
  return`<section class="card hero ${me?'active':''}" style="--c:${h.color}"><div class="hh"><img src="${PORTRAIT[h.type]}" alt="${h.name}"><div class="bars"><h3>${h.name} <small>${h.title}</small></h3>${bar('Health',h.hp,h.maxHp,'hp')}${bar('Magic',h.mp,h.maxMp,'mp')}</div></div><div class="tags">${tags.join('')}</div><div class="moves">${mv}</div></section>`}
function renderHUD(){renderTop();if(!B||S.mode!=='battle'||B.phase==='done')return;const active=canAct();
  const boss=B.enemies.find(e=>EDEF[e.type].kind==='boss'&&alive(e));const sun=boss&&!B.sunUsed&&(boss.type==='boss2'?G.flags.sunCrystal:G.flags.sunword&&boss.hp<=boss.maxHp/2);
  const tgt=B.targeting?`<div class="pick"><div class="lbl">Pick a target</div><div class="pickrow">${B.targeting.cands.map(e=>`<button class="tbtn" data-target="${B.enemies.indexOf(e)}">${esc(e.name)} <small>${e.hp} hp</small></button>`).join('')}<button class="tbtn ghost" data-act="cancel">Cancel</button></div></div>`:'';
  panel.innerHTML=`<div class="battle">${heroCard(G.heroes[0],0,active)}<section class="card center">${tgt}<div><div class="lbl">Team Power ${G.combo}%</div><div class="bar tp"><i style="width:${G.combo}%"></i></div></div>
  <button class="team" data-act="starfire" ${active&&G.combo>=100?'':'disabled'}><b>Starfire Storm</b><small>${G.combo>=100?'READY! Hits every monster':'Team move. Fills up as you fight'}</small></button>
  ${sun?`<button class="sun" data-act="sunword" ${active?'':'disabled'}><b>Speak the Sunword!</b><small>Free move. Breaks Vexmora's armor</small></button>`:''}
  <button class="potion" data-act="potion" ${active&&G.potions>0?'':'disabled'}><b>Drink a Potion</b><small>${G.potions} left. +15 health, or wakes up a friend</small></button></section>${heroCard(G.heroes[1],1,active)}</div>`}
panel.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled||!B||S.mode!=='battle')return;
  if(b.dataset.move)chooseMove(b.dataset.move);else if(b.dataset.target)pickTarget(B.enemies[+b.dataset.target]);
  else if(b.dataset.act==='cancel'){B.targeting=null;msg(`${cur().name}'s turn! Pick a power.`);renderHUD()}
  else if(b.dataset.act==='starfire')starfire();else if(b.dataset.act==='sunword')sunword();else if(b.dataset.act==='potion')drinkPotion()});

function jiggle(a,amt,dir){if(!a)return;a.jig=amt;a.jigT=0;if(dir)a.jdir=dir}
// Per-actor pose: jelly wobble, squash/stretch, breathing and a bouncy walk.
function applyPose(a,t){let sx=a.sx||1,sy=a.sy||1;
  if(a.jig){const k=a.jig*Math.exp(-a.jigT*7)*Math.cos(a.jigT*30);sx*=1+k;sy*=1-k*.8;ctx.rotate(k*.35*(a.jdir||1))}
  if(!a.down){const b=Math.sin(t*2.4+a.phase);sx*=1-.012*b;sy*=1+.018*b}
  if(a.walk>0){ctx.translate(0,-Math.abs(Math.sin(t*13+a.phase))*7);ctx.rotate(Math.sin(t*13+a.phase)*.07)}
  if(sx!==1||sy!==1)ctx.scale(sx,sy)}
function drawCastCircles(t){if(!S.showHeroes||!G)return;for(const h of G.heroes){const a=HA[h.key],k=a.castS||0;if(k<.05||a.hidden)continue;
  const x=a.x+a.ox,y=a.y+a.oy,col=a.type==='wizard'?'#b69bff':'#bff4ff';ctx.save();ctx.globalAlpha=Math.min(1,k);ctx.globalCompositeOperation='lighter';ctx.translate(x,y);ctx.scale(1,.28);ctx.rotate(t*1.6*(a.type==='wizard'?1:-1));
  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,64*k,0,TAU);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,48*k,0,TAU);ctx.stroke();
  ctx.fillStyle=col;for(let i=0;i<8;i++){ctx.rotate(TAU/8);starPath(ctx,56*k,0,5,2,4);ctx.fill()}ctx.restore();
  if(Math.random()<k*.6){if(a.type==='wizard'){const o=orbPos(),an=rnd(0,TAU);spawn({x:o.x+Math.cos(an)*55,y:o.y+Math.sin(an)*55,vx:-Math.cos(an)*110,vy:-Math.sin(an)*110,life:.5,size:3,color:'#bff4ff'})}
    else spawn({x:x+rnd(-55,55),y:y-rnd(0,10),vx:0,vy:rnd(-130,-60),life:.9,size:3,color:'#e8f6ff',type:'star'})}}}
// Cross-fade between scenes: snapshot the old frame, fade it out over the new one.
const xfCanvas=document.createElement('canvas');let xf=0;
function startXfade(){if(!cv.width)return;xfCanvas.width=cv.width;xfCanvas.height=cv.height;xfCanvas.getContext('2d').drawImage(cv,0,0);xf=1}
function drawXfade(dt){if(xf<=0)return;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=xf*xf;ctx.drawImage(xfCanvas,0,0,cv.width,cv.height);ctx.restore();xf-=dt*2}
function walkIn(){const hs=[HA.george,HA.rory];hs.forEach(a=>{a.ox=-340;a.walk=1});
  tween(1000,p=>hs.forEach((a,i)=>{const q=clamp(p*1.15-i*.15,0,1);a.ox=-340*Math.pow(1-q,2)})).then(()=>hs.forEach(a=>{a.ox=0;a.walk=0;jiggle(a,.12)}))}
const baseSetScene=setScene;

// Wind-up, dash with stretch, impact, bounce back.
lungeHit=async function(a,target,onHit){const dir=Math.sign(target.x-a.x)||1,dx=(target.x-a.x)*.62,dy=(target.y-a.y)*.3;
  await tween(140,p=>{a.ox=-16*dir*ease(p);a.rot=-.13*dir*ease(p);a.sx=1-.06*p;a.sy=1+.05*p});
  sfx.swish();await tween(150,p=>{a.ox=-16*dir+(dx+16*dir)*ease(p);a.oy=dy*ease(p);a.rot=-.13*dir+.26*dir*p;a.sx=1+.16*Math.sin(p*Math.PI);a.sy=1-.1*Math.sin(p*Math.PI)});
  a.sx=a.sy=1;jiggle(a,.16,dir);await onHit();
  await tween(270,p=>{a.ox=dx*(1-ease(p));a.oy=dy*(1-ease(p))-Math.sin(p*Math.PI)*20;a.rot=.13*dir*(1-p)});a.ox=a.oy=0;a.rot=0};
// Projectiles get comet tails; fire gets a flickering flame and smoke.
projectile=function(x1,y1,x2,y2,o={}){const{ms=480,color='#ff9a3d',size=14,arc=60,trail=color,kind}=o;const fire=kind==='fire'||/^#ff[68]a3d$/i.test(color);
  return new Promise(res=>{let t=0;const hist=[];fx.push(dt=>{t+=dt*1000/ms;const p=Math.min(1,t),x=lerp(x1,x2,p),y=lerp(y1,y2,p)-Math.sin(p*Math.PI)*arc;hist.push([x,y]);if(hist.length>9)hist.shift();
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(let i=1;i<hist.length;i++){const k=i/hist.length;ctx.strokeStyle=color;ctx.globalAlpha=k*.55;ctx.lineWidth=size*k*1.1;ctx.beginPath();ctx.moveTo(hist[i-1][0],hist[i-1][1]);ctx.lineTo(hist[i][0],hist[i][1]);ctx.stroke()}ctx.restore();
    if(fire&&hist.length>1){const[px,py]=hist[hist.length-2],ang=Math.atan2(y-py,x-px);glow(ctx,x,y,size*3.4,color,.9);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalCompositeOperation='lighter';
      for(const[c,s]of[['#ff5a2a',1],['#ffae3d',.72],['#fff4c0',.42]]){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(size*1.1*s,0);ctx.quadraticCurveTo(0,-size*s*(1+Math.sin(t*70)*.15),-size*2.8*s,Math.sin(t*50)*3);ctx.quadraticCurveTo(0,size*s,size*1.1*s,0);ctx.fill()}ctx.restore();
      spawn({x,y,vx:rnd(-30,30),vy:rnd(-50,-10),life:.7,size:size*.55,color:'#2e2838',type:'smoke'});spawn({x,y,vx:rnd(-60,60),vy:rnd(-60,60),life:.35,size:size*.4,color:trail})}
    else{glow(ctx,x,y,size*3,color,.9);ell(ctx,x,y,size*.5,size*.5,'#fff8e0');spawn({x,y,vx:rnd(-40,40),vy:rnd(-40,40),life:.4,size:size*.45,color:trail})}
    if(p>=1){res();return false}return true})})};
explode=function(x,y,color){burst(x,y,36,color,{speed:340,size:6,life:.7});burst(x,y,14,'#fff',{speed:180,size:4,life:.35});burst(x,y,14,'#ffd66b',{speed:280,size:3,life:1,grav:520,dir:-Math.PI/2,spread:2.6});
  for(let i=0;i<(RM?2:8);i++)spawn({x:x+rnd(-22,22),y:y+rnd(-22,22),vx:rnd(-50,50),vy:rnd(-70,-20),life:rnd(.7,1.2),size:rnd(8,14),color:'#2a2436',type:'smoke'});
  ring(x,y,color,125,460);ring(x,y,'#ffffff',70,260);let t=0;fx.push(dt=>{t+=dt;if(t>.18)return false;glow(ctx,x,y,95*(1-t/.18)+20,'#fff6d0',1);return true})};
function lightPillar(x,y,col){let t=0;fx.push(dt=>{t+=dt;if(t>1)return false;const k=Math.sin(t*Math.PI);ctx.save();ctx.globalCompositeOperation='lighter';const g2=ctx.createLinearGradient(0,y-240,0,y);g2.addColorStop(0,'rgba(0,0,0,0)');g2.addColorStop(1,col);ctx.globalAlpha=k*.55;ctx.fillStyle=g2;ctx.fillRect(x-34*k,y-240,68*k,240);ctx.restore();return true})}

/* ---- dice duel UI ---- */
function dieH(){return`<div class="die roll">${'<span></span>'.repeat(9)}</div>`}
async function duel(A,D,o={}){const id=++rollId,a=[ri(1,6),ri(1,6)],d=[ri(1,6),ri(1,6)],bon=o.bonus||0;
  const side=X=>`<div class="dside" style="--c:${X.color}"><div class="dn">${esc(X.name)}</div><div class="row">${dieH()}${dieH()}</div><div class="ds">Skill ${X.skill}</div></div>`;
  diceEl.innerHTML=`<div class="duel">${side(A)}<div class="vs">VS</div>${side(D)}</div><div class="verdict"></div>`;
  const dice=[...diceEl.querySelectorAll('.die')];sfx.dice();const iv=setInterval(()=>dice.forEach(x=>setFace(x,ri(1,6))),70);
  await wait(o.fast?480:650);clearInterval(iv);const vals=[...a,...d];dice.forEach((x,i)=>{x.classList.remove('roll');x.classList.add('land');setFace(x,vals[i])});
  const ta=a[0]+a[1]+A.skill+bon,td=d[0]+d[1]+D.skill,crit=a[0]===6&&a[1]===6,fumble=a[0]===1&&a[1]===1,hit=crit||(!fumble&&ta>td);
  const ds=diceEl.querySelectorAll('.ds');ds[0].innerHTML=`${a[0]}+${a[1]} + Skill ${A.skill}${bon?` + ${bon} ${o.bonusLabel||''}`:''} = <b>${ta}</b>`;ds[1].innerHTML=`${d[0]}+${d[1]} + Skill ${D.skill} = <b>${td}</b>`;
  const good=A.hero?hit:!hit,v=diceEl.querySelector('.verdict');v.className='verdict '+(good?'good':'bad');
  v.textContent=crit?'DOUBLE SIX! CRITICAL!':fumble?'DOUBLE ONE! OOPS!':hit?(A.hero?'HIT!':`${D.name} is hit!`):ta===td?'A tie! Both miss.':(A.hero?'Missed!':`${D.name} dodges!`);
  if(crit)sfx.chime();await wait(o.fast?650:850);setTimeout(()=>{if(rollId===id)diceEl.innerHTML=''},600);
  return{hit,crit,fumble,margin:ta-td}}
async function testLuck(h){const id=++rollId,r=[ri(1,6),ri(1,6)],need=h.luck;
  diceEl.innerHTML=`<div class="duel"><div class="dside" style="--c:#8dff9a"><div class="dn">Test your Luck, ${esc(h.name)}!</div><div class="row">${dieH()}${dieH()}</div><div class="ds">Roll ${need} or less to be lucky</div></div></div><div class="verdict"></div>`;
  const dice=[...diceEl.querySelectorAll('.die')];sfx.dice();const iv=setInterval(()=>dice.forEach(x=>setFace(x,ri(1,6))),70);await wait(650);clearInterval(iv);dice.forEach((x,i)=>{x.classList.remove('roll');x.classList.add('land');setFace(x,r[i])});
  const tot=r[0]+r[1],ok=tot<=need;h.luck=Math.max(0,h.luck-1);diceEl.querySelector('.ds').innerHTML=`${r[0]} + ${r[1]} = <b>${tot}</b> (needed ${need} or less)`;
  const v=diceEl.querySelector('.verdict');v.textContent=ok?'LUCKY!':'UNLUCKY!';v.className='verdict '+(ok?'good':'bad');ok?sfx.chime():sfx.honk();
  await wait(900);setTimeout(()=>{if(rollId===id)diceEl.innerHTML=''},600);renderHUD();return ok}

/* ---- resolving a turn ---- */
async function sFireball(l){const al=laneEnemies(l),front=closest(al);SG.cast='g';sfx.fire();const c=front?sCenter(front):{x:600,y:LANE_Y[l]-30};

async function sIce(l){SG.frozen[l]=1;SG.cast='g';sfx.shield();msg(`Ice Wall! The ${SG.cfg.laneNames[l]} is frozen this turn.`);for(let x=300;x<W;x+=80)burst(x,LANE_Y[l]-20,8,'#8fe9ff',{type:'star',speed:120});await wait(700);SG.cast=null}

  fx.push(dt=>{t+=dt;if(t>1.1)return false;for(let k=0;k<3;k++){const x=200+t*900-k*70;ctx.save();ctx.translate(x,y+4+(k%2)*6);ctx.scale(-.42,.42);drawWolf(ctx,t*8+k,{});ctx.restore();if(Math.random()<.35)spawn({x:x-30,y:y+4,vx:rnd(-40,0),vy:rnd(-40,-10),life:.5,size:6,color:'#8a7a6a',type:'smoke'})}return true});
  await wait(450);for(const e of laneEnemies(l))sHit(e,5);S.shake=8;await wait(700);SG.cast=null}
async function defendersFire(){for(let l=0;l<3;l++)for(let s=0;s<2;s++){const d=SG.slots[l][s];if(!d||d.type==='knight')continue;const al=laneEnemies(l);if(!al.length)continue;const p=slotPos(l,s,d.type);

  else if(d.type==='friend'){const e=closest(al),c=sCenter(e);sfx.swish();await projectile(p.x,p.y-10,c.x,c.y,{ms:360,color:'#bfe0ff',size:12,arc:50});slash(c);sHit(e,4)}
  await wait(110)}}
async function enemiesAdvance(){const list=SG.en.filter(e=>!e.dead).sort((a,b)=>b.step-a.step);
  for(const e of list){if(e.dead||SG.frozen[e.lane])continue;
    if(e.step>=4){const kn=SG.slots[e.lane].find(d=>d&&d.type==='knight'&&d.hp>0);await tween(160,p=>e.ox=-30*p);
      if(kn&&!e.su.fly){kn.hp=Math.max(0,kn.hp-e.su.wall);tween(220,p=>kn.ox=-12*Math.sin(p*Math.PI));float(242,LANE_Y[e.lane]-80,'-'+e.su.wall,'#ff5277',26);sfx.hit();comic(262,LANE_Y[e.lane]-120,pickOne(['CLANG!','BONK!','CLONK!']));sHit(e,3);
        if(kn.hp<=0){const i=SG.slots[e.lane].indexOf(kn);SG.slots[e.lane][i]=null;float(242,LANE_Y[e.lane]-110,'The Knight is knocked out!','#ffc2d0',20);sfx.lose()}}
      else{SG.wall=Math.max(0,SG.wall-e.su.wall);S.shake=9;SG.wallFlash=.35;float(120,LANE_Y[e.lane]-40,'-'+e.su.wall,'#ff5277',34);sfx.hit();burst(210,LANE_Y[e.lane]-20,16,'#8a7a8a',{speed:170,grav:420});comic(170,LANE_Y[e.lane]-110,pickOne(['CRUNCH!','WHAM!','KRAK!']))}
      await tween(200,p=>e.ox=-30*(1-p));e.ox=0;if(SG.wall<=0)return}
    else e.step=Math.min(4,e.step+e.su.speed)}

async function runWave(){const turns=SG.cfg.waves[SG.wave];let ti=0;SG.stampede=false;SG.turn=0;sSpawn(turns[ti++]);await wait(900);
  for(;;){SG.turn++;SG.frozen=[0,0,0];
    if(!SG.en.some(e=>!e.dead)){if(ti<turns.length){sSpawn(turns[ti++]);await wait(900);continue}return true}
    const A=await heroTurn();msg('');
    if(A.g&&A.g.a==='fire')await sFireball(A.g.lane);if(A.g&&A.g.a==='ice')await sIce(A.g.lane);
